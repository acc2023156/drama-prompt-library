<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天玑 · 提示词库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#101010; --bg-2:#161618; --panel:#1b1b1f; --panel-2:#222227;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#f8fafc; --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.46);
  --brand:#731dfb; --brand-2:#8b45ff; --brand-soft:rgba(115,29,251,.16);
  --yellow:#ffe000; --green:#3ddc97; --amber:#f5b94a; --red:#ff5d6c;
  --glass:linear-gradient(-17deg,rgba(214,225,255,.06),rgba(214,225,255,.11));
  --r:12px; --r-lg:18px;
  --font:Inter,"Noto Sans SC",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
a.cta,a.btn-white,a.btn-dark{text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:var(--brand);color:#fff}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:6;height:60px;display:flex;align-items:center;gap:14px;padding:0 18px 0 22px;background:rgba(13,13,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-logo{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 8px;margin-right:4px;border-radius:12px;flex:none;text-decoration:none}
.tb-logo:hover{background:rgba(255,255,255,.06)}
.tb-logo.on{background:#2a2a2e}
.tb-logo svg{width:32px;height:32px}
.tb-name{font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
.tb-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#141416;border:1px solid var(--line)}
.tb-seg a{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;text-decoration:none;color:var(--text-2);font-size:15px;font-weight:500;white-space:nowrap}
.tb-seg a:hover{color:#fff}
.tb-seg a.on{background:#2a2a2e;color:#fff}
.tb-seg svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-stat{font-size:14px;color:var(--text-2);white-space:nowrap}
.soon{max-width:560px;margin:90px auto 0;text-align:center}
.soon .big{width:88px;height:88px;margin:0 auto 22px;border-radius:24px;background:#1d1d20;border:1px solid var(--line-2);display:grid;place-items:center}
.soon .big svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.soon h1{font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:30px;margin:0 0 10px}
.soon p{color:var(--text-2);margin:0 0 24px}

/* ---------- shell: rail + collapsible panel + main ---------- */
.shell{display:flex;min-height:calc(100vh - 60px)}

.pside{position:sticky;top:60px;height:calc(100vh - 60px);width:264px;flex:none;overflow:auto;scrollbar-width:none;border-right:1px solid var(--line);background:#111113;padding:16px 12px 24px;transition:width .2s,padding .2s}
body.ps-off .pside{width:0;padding:0;border-right:0;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 16px;border-radius:12px;background:#1d1d20;border:1px solid var(--line);color:#e9e9ee;font-size:15px;white-space:nowrap}
.pill:hover{background:#26262a}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.ps-float{position:absolute;top:24px;left:26px;z-index:4;display:none;align-items:center;gap:8px}
body.ps-off .ps-float{display:flex}
.ps-row{display:flex;align-items:center;gap:8px}
.pro{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 12px;border-radius:12px;background:#1d1d20;border:1px solid var(--line);color:var(--text-2);font:800 13px/1 Inter,var(--font);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.pro:hover{background:#26262a}
.pro .sw{width:34px;height:20px}
.pro .sw::after{width:14px;height:14px}
.pro .sw.on::after{transform:translateX(14px)}
.pro.on{color:#fff}
.pro.on b{background:linear-gradient(90deg,#b98bff,#3fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pro em{font-style:normal;font-weight:500;font-size:12px;color:var(--text-3)}
.ps-title{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--text-3);padding:18px 10px 6px}
.ps-title svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pside a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--text-2);font-size:13.5px;line-height:1.45}
.pside a:hover{background:rgba(255,255,255,.05);color:#fff}
.pside a.on{background:#232326;color:#fff}
.pside a .i{flex:none;min-width:30px;font:600 12px Inter,monospace;color:var(--text-3)}
.pside a .n{margin-left:auto;font-size:11px;color:var(--text-3)}
.pside a.head{color:#fff;font-weight:600;font-size:14px}
.pside::-webkit-scrollbar{display:none}
.pside a.fn{align-items:center}
.pside a svg{flex:none;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;align-self:center}
.pside a.sub{padding-left:37px}
.pside a .d{display:block;font-size:12px;color:var(--text-3);margin-top:1px}
.pside .ptag{margin-left:auto;flex:none;align-self:center;padding:2px 7px;border-radius:6px;background:var(--brand);color:#fff;font:800 10px/1.4 Inter,var(--font);letter-spacing:.04em}
.pside .ps-hr{height:1px;background:var(--line);margin:14px 6px 4px}

main{position:relative;flex:1;min-width:0;background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px}
body.ps-off main .wrap{padding-top:56px}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px 80px}
.hero{position:relative;overflow:hidden;padding:64px 0 34px;text-align:center;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40% -10% 0;z-index:-1;
  background:radial-gradient(closest-side at 50% 55%,rgba(170,20,40,.35),transparent 70%),radial-gradient(closest-side at 70% 30%,rgba(115,29,251,.22),transparent 70%)}
.hero .rings{position:absolute;left:50%;top:52%;width:640px;height:640px;transform:translate(-50%,-50%);z-index:-1;opacity:.35}
.hero h1{margin:0 auto;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.15;letter-spacing:.02em;
  background:linear-gradient(90deg,#aeb4be 0%,#f2f4f7 28%,#fff 50%,#f2f4f7 72%,#aeb4be 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--text-2);margin:14px auto 0;max-width:560px}

.composer{margin:28px auto 0;max-width:760px;text-align:left;border-radius:var(--r-lg);border:1px solid var(--line-2);background:rgba(22,22,26,.82);backdrop-filter:blur(12px);padding:14px 16px 14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.composer .top{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase}
.search{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.search svg{width:18px;height:18px;stroke:var(--text-3);fill:none;stroke-width:2}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:15px var(--font)}
.search input::placeholder{color:var(--text-3)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:30px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button.on{background:#fff;color:#111214}
.chip-btn{height:36px;padding:0 14px;border-radius:999px;background:var(--glass);color:var(--text-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip-btn.on{color:#fff;box-shadow:inset 0 0 0 1px var(--brand-2);background:var(--brand-soft)}
.chip-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.sec-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:44px 0 16px}
.sec-head h2{margin:0;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:26px}
.sec-head .meta{color:var(--text-3);font-size:13px}
.sec-head .sp{flex:1}
.btn-white{height:40px;padding:0 16px;border-radius:10px;background:#fff;color:#111;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn-dark{height:40px;padding:0 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:#fff;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn-white svg,.btn-dark svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:168px;padding:16px;border-radius:var(--r-lg);background:linear-gradient(180deg,#1c1c20,#151517);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.card:hover{border-color:rgba(139,69,255,.6);transform:translateY(-2px)}
.card .id{font:600 12px/1 Inter,monospace;color:var(--text-3)}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.45}
.card .desc{color:var(--text-3);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.card .tl{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--text-2);white-space:nowrap}
.tag.prod{background:var(--yellow);color:#111}
.tag.ref{background:rgba(245,185,74,.14);color:var(--amber)}
.tag.int{background:var(--brand-soft);color:#c9a8ff}
.tag.patch{background:rgba(61,220,151,.12);color:var(--green)}
.tag.tool{background:rgba(255,255,255,.05);color:var(--text-3)}
.empty{padding:60px 0;text-align:center;color:var(--text-3)}

/* ---------- detail ---------- */
.detail{max-width:860px;margin:0 auto;padding:36px 0 0}
.crumb{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:13px;margin-bottom:18px;flex-wrap:wrap}
.crumb a{text-decoration:none}.crumb a:hover{color:#fff}
.detail h1{font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(24px,3.4vw,34px);line-height:1.3;margin:0 0 12px}
.detail .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.md{color:var(--text-2);font-size:14.5px;line-height:1.8}
.md strong{color:#fff}
.md h2,.md h3,.md h4{color:#fff;margin:28px 0 10px}
.md a{color:#c9a8ff}
.md blockquote{margin:14px 0;padding:12px 16px;border-radius:var(--r);background:var(--brand-soft);border:1px solid rgba(139,69,255,.35);color:#e6dbff}
.md blockquote p{margin:0}
.md table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel);color:#fff}
.md code{font-family:ui-monospace,Consolas,monospace;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px;font-size:.92em}
.code{position:relative;margin:16px 0;border-radius:var(--r-lg);border:1px solid var(--line-2);background:#0b0b0d;overflow:hidden}
.code .bar{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-3)}
.code .bar .sp{flex:1}
.code pre{margin:0;padding:16px;max-height:520px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.75 "Noto Sans SC",ui-monospace,Consolas,monospace;color:#e9e9ee}
.copy{height:30px;padding:0 12px;border-radius:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.copy:hover{background:var(--brand-2)}
.copy.done{background:var(--green);color:#062}
.copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.pager{display:flex;gap:12px;margin-top:40px}
.pager a{flex:1;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);text-decoration:none;background:var(--bg-2)}
.pager a:hover{border-color:var(--brand-2)}
.pager small{display:block;color:var(--text-3);font-size:12px}
.pager .r{text-align:right}

/* ---------- assembler ---------- */
.asm{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:8px;align-items:start}
.panel{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg-2);padding:16px}
.panel h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.panel + .panel{margin-top:14px}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle .t{flex:1}
.toggle .t b{display:block;font-size:13.5px}
.toggle .t span{font-size:12px;color:var(--text-3)}
.sw{position:relative;width:38px;height:22px;flex:none;border-radius:99px;background:rgba(255,255,255,.14);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--brand)}
.sw.on::after{transform:translateX(16px)}
.warn{margin-top:8px;font-size:12px;color:var(--amber)}
textarea.style{width:100%;min-height:150px;margin-top:10px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:#0b0b0d;color:var(--text);padding:10px;font:12.5px/1.7 var(--font)}
.plist a{display:flex;gap:8px;padding:6px 0;text-decoration:none;font-size:13px;color:var(--text-2);border-top:1px dashed var(--line)}
.plist a:hover{color:#fff}
.plist .s{flex:none;width:28px;color:var(--green);font-weight:700}
.stat{display:flex;gap:18px;font-size:12px;color:var(--text-3);margin-bottom:10px}
.stat b{color:#fff;font-size:14px}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 资产库 ---------- */
.as-title{text-align:center;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(24px,3vw,32px);margin:56px 0 28px}
.as-cards{display:grid;grid-template-columns:repeat(2,minmax(0,340px));justify-content:center;gap:22px}
.mcard{position:relative;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,#1a1a1d,#131315);padding:26px 18px 0;min-height:430px}
.mcard:hover{z-index:5}
.mcard.r .pop{left:auto;right:calc(100% - 24px);transform:translate(-8px,-50%)}
.mcard.r .mi:hover .pop{transform:translate(0,-50%)}
.stackwrap{position:absolute;left:0;right:0;bottom:0;height:180px;overflow:hidden;border-radius:0 0 26px 26px;pointer-events:none}
.mcard h3{margin:0 0 14px 14px;font-size:16px;font-weight:500;color:var(--text-3)}
.mi{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:14px;color:#f2f2f2;font-size:17px;font-weight:500;text-align:left}
.mi:hover{background:rgba(255,255,255,.06)}
.mi svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pop{position:absolute;left:calc(100% - 24px);top:50%;transform:translate(8px,-50%);width:250px;opacity:0;pointer-events:none;z-index:20;
  border-radius:16px;background:#2b2b2f;border:1px solid var(--line-2);box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden;transition:opacity .12s,transform .12s}
.mi:hover .pop{opacity:1;transform:translate(0,-50%)}
.pop .pv{height:130px;background:#1a1a1d}
.pop p{margin:0;padding:10px 12px 12px;font-size:13px;line-height:1.55;color:#eee}
.pv{display:grid;gap:4px;padding:8px}
.pv i{display:grid;place-items:center;border-radius:6px;background:var(--g,linear-gradient(160deg,#3a4a5e,#20242c));font-style:normal}
.pv i svg{width:22px;height:22px;stroke:rgba(255,255,255,.75);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stack{position:absolute;left:50%;bottom:-26px;width:220px;height:150px;transform:translateX(-50%);pointer-events:none}
.stack b{position:absolute;bottom:0;width:120px;height:150px;border-radius:18px;border:3px solid #2a2a2e;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.stack b svg{width:46px;height:46px;stroke:rgba(255,255,255,.8);fill:none;stroke-width:1.4}
.stack b:nth-child(1){left:6px;transform:rotate(-14deg);background:linear-gradient(160deg,#5b6b56,#2d3a33)}
.stack b:nth-child(2){left:52px;transform:rotate(-5deg);background:linear-gradient(160deg,#6d5a48,#2f2722)}
.stack b:nth-child(3){left:98px;transform:rotate(6deg);background:linear-gradient(160deg,#7f8fa6,#3a4456)}

.mine{margin-top:56px}
.mine .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.acard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line);background:#151517}
.acard .t{display:flex;gap:8px;align-items:center;font-weight:700}
.acard .t svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.acard .s{font-size:12px;color:var(--text-3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.acard .row button{height:30px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.07);font-size:12px}
.acard .row button:hover{background:rgba(255,255,255,.12)}

/* 节点编辑器（下一层） */
.ed-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:30px 0 18px}
.ed-head h2{margin:0;font-size:20px;font-weight:700}
.ed-head .d{color:var(--text-3);font-size:13px}
.graph{position:relative;display:grid;grid-template-columns:240px 1fr 300px;align-items:center;gap:0;min-height:300px}
.inputs{display:flex;flex-direction:column;gap:14px;z-index:1}
.node{border-radius:16px;border:1px solid var(--line-2);background:#18181b;padding:10px}
.node .nh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:8px}
.node .nh svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.drop{display:grid;place-items:center;height:110px;border-radius:10px;border:1.5px dashed rgba(255,255,255,.18);color:var(--text-3);font-size:12px;cursor:pointer;overflow:hidden;background:#111}
.drop:hover{border-color:var(--brand-2);color:#fff}
.drop img{width:100%;height:100%;object-fit:cover}
.node textarea,.node input{width:100%;border:0;outline:0;resize:vertical;background:#111;border-radius:10px;color:var(--text);padding:8px 10px;font:13px/1.6 var(--font)}
.node input{margin-bottom:8px}
.wires{position:absolute;inset:0;pointer-events:none}
.outnode{grid-column:3;z-index:1}
.outnode .res{height:190px;border-radius:12px}
.outnode .res .pv{height:100%;padding:0}
a.pill{text-decoration:none}
.outnode .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:8px}

.composer2{margin:22px auto 0;max-width:820px;border-radius:22px;border:1px solid var(--line-2);background:#1b1b1e;padding:14px 16px 12px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.slots{display:flex;gap:8px;margin-bottom:10px}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem('pl.'+k)); localStorage.setItem('pl.'+k, JSON.stringify(v)); }catch(e){ return null } }
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1400)}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text) }
  catch(e){ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove() }
  toast('已复制到剪贴板');
  if(btn){btn.classList.add('done');const h=btn.innerHTML;btn.innerHTML=ico('check')+'已复制';setTimeout(()=>{btn.classList.remove('done');btn.innerHTML=h},1300)}
}
function firstCode(md){const m=md.match(/```[^\n]*\n([\s\S]*?)\n```/);return m?m[1]:''}
function usage(md){const m=md.match(/\*\*用法\*\*[:：]\s*([^\n]+)/);return m?m[1].replace(/[*`]/g,''):''}
function licClass(l){return l.startsWith('内部')?'int':l.includes('仅参考')?'ref':''}
function tagsHtml(e, full){
  const t=[];
  if(e.status) t.push(`<span class="tag prod">${esc(full?e.status:(e.status.includes('已用于生产')?'已用于生产':e.status.slice(0,10)))}</span>`);
  t.push(`<span class="tag ${licClass(e.license)}">${esc(e.license)}</span>`);
  if(e.patches) t.push(`<span class="tag patch">补 6.0【${e.patches.join('】【')}】</span>`);
  if(e.tool) t.push(`<span class="tag tool">适用 ${esc(e.tool)}</span>`);
  return t.join('');
}
function renderMd(md){
  let html;
  if(window.marked){ html = marked.parse(md, {gfm:true, breaks:false}) }
  else { html = '<pre style="white-space:pre-wrap">'+esc(md)+'</pre>' }
  const box=document.createElement('div');box.innerHTML=html;
  box.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  box.querySelectorAll('pre').forEach(pre=>{
    const code=pre.textContent;
    const w=document.createElement('div');w.className='code';
    w.innerHTML=`<div class="bar">${ico('copy').replace('<svg','<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"')}提示词正文 · ${code.length} 字<span class="sp"></span><button class="copy">${ico('copy')}复制</button></div><pre></pre>`;
    w.querySelector('pre').textContent=code;
    w.querySelector('.copy').onclick=e=>copyText(code,e.currentTarget);
    pre.replaceWith(w);
  });
  return box;
}

    drawWires();

  function drawWires(){
    const g=$('graph'), w=$('wires'), out=$('out'); if(!g||getComputedStyle(w).display==='none') return;
    const gr=g.getBoundingClientRect(), orc=out.getBoundingClientRect();
    const x2=orc.left-gr.left, y2=orc.top-gr.top+orc.height/2;
    w.setAttribute('viewBox',`0 0 ${gr.width} ${gr.height}`);
    w.innerHTML=`<defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#3fb6ff"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs>`+

        return `<path d="M${x1} ${y1} C${x1+c} ${y1} ${x2-c} ${y2} ${x2} ${y2}" fill="none" stroke="url(#wg)" stroke-width="2.2" opacity=".85"/>`}).join('')+
      `<circle cx="${x2}" cy="${y2}" r="7" fill="#18181b" stroke="#fff" stroke-width="1.5"/>`;
  }

  }
  f.inputs.forEach((_,k)=>{
    const inp=document.querySelector(`[data-file="${k}"]`);
    inp.onchange=()=>{const file=inp.files[0]; if(!file) return; const rd=new FileReader();
      rd.onload=()=>{st.imgs[k]=rd.result; $('drop'+k).innerHTML=`<img src="${rd.result}" alt="">`; $('drop'+k).appendChild(inp); refresh()}; rd.readAsDataURL(file)};
  });
  $('nm').oninput=e=>{st.name=e.target.value;refresh()};

  document.querySelectorAll('.ck').forEach(c=>c.onclick=()=>{const o=c.dataset.o;
    st.opts = st.opts.includes(o)? st.opts.filter(x=>x!==o) : f.opts.filter(x=>x===o||st.opts.includes(x));
    c.classList.toggle('on');refresh()});
  $('sbtn').onclick=e=>{e.stopPropagation();$('spop').classList.toggle('open');drawStyles()};
  $('spop').onclick=e=>e.stopPropagation();
  document.addEventListener('click',()=>$('spop')&&$('spop').classList.remove('open'));
  document.querySelectorAll('#stabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;drawStyles()});
  $('sq').oninput=drawStyles;
  $('go').onclick=e=>copyText($('prompt').value,e.currentTarget);
  $('save').onclick=()=>{
    const list=store('assets')||[]; const {imgs,...keep}=st;
    const item={fn:f.id,name:st.name,prompt:$('prompt').value,state:keep,time:Date.now()};
    if(saved) list[idx]=item; else list.unshift(item);

  };
  addEventListener('resize',drawWires);
  refresh();
}

  novel:{tab:'汇入小说', btn:'资产库生成', sub:'产生影片内的生动角色与故事场景'},
};
const wzEps = W => W.eps==='自定义' ? (+W.epsCustom||0) : W.eps;
const wzMins = W => W.mins==='自定义' ? (+W.minsCustom||0) : W.mins;
const nfmt = n => n.toLocaleString('en-US');
function wzScore(W){
  return (W.pitch.trim()?2:0)+(W.hooks.length?1:0)+(W.core.trim()?2:0)+(W.diff.trim()?2:0)+(W.rival.trim()?1:0)+(W.hero.trim()?1:0)+(W.world.trim()?1:0);
}
function wzTitle(W){
  if(W.title.trim()) return W.title.trim();
  const src = W.mode==='novel' ? W.novel : W.doc;
  const m = src.match(/《([^》\n]{1,30})》/) || src.match(/(?:剧名|片名|作品名称?)[:：]\s*([^\n]{1,30})/);
  return m ? m[1].trim() : '';
}
function wzNeeds(W){
  const n=[];
  if(W.mode==='paste' && !W.doc.trim()) n.push('在第 1 步贴上策划文件');
  if(W.mode==='novel' && (W.novel.length<2000||W.novel.length>400000)) n.push('在第 1 步贴上或选好小说（2,000–400,000 字）');
  if(W.mode==='auto' && !W.pitch.trim()) n.push('在第 2 步填一句话卖点');
  if(!wzEps(W)||!wzMins(W)) n.push('在第 3 步填好集数和每集时长');

}
function wzSettings(W){
  const eps=wzEps(W), mins=wzMins(W), per=mins*W.wpm;
  const s=[`作品名称：${wzTitle(W)||'（未定，请依内容取名）'}`,
    `受众：${W.aud}　配对：${W.pair}　类型：${W.genre}`,
    `一句话卖点：${W.pitch.trim()||'（未填）'}`,
    `核心爽点：${W.hooks.join('、')||'（未选）'}`,
    `台词用语：${W.lang}；剧本字形：${W.glyph}`,
    `第一季规格：共 ${eps} 集，每集约 ${mins} 分钟、约 ${nfmt(per)} 字（每分钟约 ${W.wpm} 字），合计约 ${nfmt(per*eps)} 字。`];
  if(W.style&&W.style!=='无') s.push(`画面风格：${W.style}`);
  if(W.ratio) s.push(`画面比例：${W.ratio}`);
  if(W.sequel) s.push('预留续季空间：最后一集留下 2–3 条可延续的线，不把伏笔收完。');

  const sup=SUPP.filter(([k])=>W[k].trim()).map(([k,l])=>`${l}：${W[k].trim()}`);

function lib(id){ const e=byId[id]; return e ? firstCode(e.body) : ''; }

【单集剧本格式（提示词库 2.5）】
${lib('2.5')}

【策划文件】
${W.doc.trim()}`;

写完后先自查合规红线，命中的地方直接改写。

【参考：灵感到成稿工作流（提示词库 1.1）】
${lib('1.1')}`;

${main}${supTxt}${avoid}

【长篇压缩规则（提示词库 2.12）】
${lib('2.12')}

【小说全文】
${W.novel.trim()}`;
}
function wzDupCheck(W){

  const me=grams(wzTitle(W)+W.pitch+W.core);
  const hits=works.map(w=>{const o=grams((w.title||'')+(w.W.pitch||'')+(w.W.core||''));let c=0;me.forEach(x=>o.has(x)&&c++);
    const sim=me.size&&o.size?c/Math.min(me.size,o.size):0; return {title:w.title||'（未命名）',pitch:w.W.pitch,sim, same:w.W.genre===W.genre}})

}

async function readAnyFile(file){
  const name=file.name.toLowerCase(), buf=await file.arrayBuffer();
  const loadJs=src=>new Promise((ok,bad)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error('载入失败')); document.head.appendChild(s); });
  if(name.endsWith('.docx')){
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({arrayBuffer:buf})).value;
  }
  if(name.endsWith('.pdf')){
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:buf}).promise; const out=[];
    for(let i=1;i<=pdf.numPages;i++){ const c=await (await pdf.getPage(i)).getTextContent(); out.push(c.items.map(x=>x.str+(x.hasEOL?'\n':'')).join('')); }
    return out.join('\n');
  }
  // txt / md：依序试 UTF-8、GB18030、Big5
  for(const enc of ['utf-8','gb18030','big5']){ try{ return new TextDecoder(enc,{fatal:true}).decode(buf).replace(/^﻿/,''); }catch(e){} }
  return new TextDecoder('utf-8').decode(buf);
}

/* ---------- views ---------- */
const state = {q:'', lic:'all', prod:false};
function filtered(list){
  const q=state.q.trim().toLowerCase();
  return list.filter(e=>{
    if(state.lic==='direct' && !e.license.includes('可直接用')) return false;
    if(state.lic==='ref' && !e.license.includes('仅参考')) return false;
    if(state.lic==='int' && !e.license.startsWith('内部')) return false;
    if(state.prod && !(e.status||'').includes('已用于生产')) return false;
    if(q && !(e.id+' '+e.title+' '+e.body).toLowerCase().includes(q)) return false;
    return true;
  });
}
function cardsHtml(list){
  if(!list.length) return '<div class="empty">没有符合条件的提示词</div>';
  return '<div class="grid">'+list.map(e=>`<a class="card" href="#/e/${e.id}" style="text-decoration:none">

    <h3>${esc(e.title)}</h3>
    <div class="desc">${esc(usage(e.body))}</div>
    <div class="tags">${tagsHtml(e)}</div></a>`).join('')+'</div>';
}

  for(const g of ['male','female']) DATA.roles[g].forEach((t,i)=>add('script',t.type,`${g==='male'?'男频':'女频'} · ${t.gold}`,'#/script',
    `剧本 人物 角色 主角 ${g==='male'?'男频 男主':'女频 女主'} ${Object.values(t).join(' ')}`,{pro:false,g,idx:i}));
  for(const m of ASSET_MENUS) for(const i of m.items) add('assets',i.label,i.desc,'#/assets/'+i.id,
    `资产 ${m.title} ${m.key==='role'?'角色 人物 主角 男主 女主 对手 设定 三视图 特写':'场景 空镜 设定 天气 昼夜'}`);
  add('storyboard','分镜','把剧本拆成分镜表，再组装成视频提示词','#/storyboard','分镜 镜头 视频 分镜表 成片');
  add('storyboard','6.0 组装器','组装每集 4～6 段视频提示词，可换画风','#/assembler','分镜 视频 组装 6.0 画风 镜头');
  return L;
}
function drawFuncHits(on){
  const box=document.getElementById('fhits'); if(!box) return;
  const toks=state.q.trim().toLowerCase().split(/[\s,，、]+/).filter(Boolean);
  if(!on || !toks.length){ box.innerHTML=''; return; }
  const hits=funcIndex().filter(x=>toks.every(t=>x.kw.includes(t))).sort((a,b)=>!!(a.pick&&a.pick.g)-!!(b.pick&&b.pick.g));
  if(!hits.length){ box.innerHTML=''; return; }
  const F=Object.fromEntries(FUNCS.map(f=>[f.k,f]));
  const show=hits.slice(0,9);
  box.innerHTML=`<div class="sec-head" style="margin:30px 0 12px"><h2 style="font-size:18px">相关功能</h2><span class="meta">${hits.length} 项${hits.length>show.length?' · 显示前 '+show.length+' 项':''}</span></div>
    <div class="fhits">${show.map((x,k)=>`<a class="fhit" href="${x.href}" data-k="${k}"><span class="ft">${ico(F[x.fn].icon)}${F[x.fn].label}</span><b>${esc(x.title)}</b><span class="fd">${esc(x.desc)}</span></a>`).join('')}</div>
    <div class="sec-head" style="margin:30px 0 0"><h2 style="font-size:18px">提示词</h2></div>`;
  box.querySelectorAll('.fhit').forEach(a=>a.onclick=()=>{
    const p=show[+a.dataset.k].pick; if(!p) return;
    store('pro',p.pro);
    if(p.g) store('sxPick',{g:p.g,idx:p.idx,name:'',title:'',q:''});
  });
}
function grouped(list){
  return DATA.groups.map(g=>{
    const l=list.filter(e=>e.folder===g.key); if(!l.length) return '';
    return `<div class="sec-head" style="margin:30px 0 12px"><h2 style="font-size:18px">${esc(g.label)}</h2><span class="meta">${l.length} 条</span></div>${cardsHtml(l)}`;
  }).join('');
}
function composer(compact){
  return `<div class="composer" ${compact?'style="margin:0;max-width:none"':''}>
    <div class="top">Prompt Library<span style="margin-left:auto;text-transform:none;letter-spacing:0">${esc(versionLine())}</span></div>
    <label class="search">${ico('search')}<input id="q" placeholder="搜索，如：剧本、角色、男主、女主、分镜" value="${esc(state.q)}"></label>
    <div class="row">
      <span class="seg" id="lic">
        <button data-v="all">全部来源</button><button data-v="direct">可直接用</button><button data-v="ref">仅参考</button><button data-v="int">内部</button>
      </span>
      <button class="chip-btn ${state.prod?'on':''}" id="prod">${ico('check')}只看已用于生产</button>
    </div></div>`;
}
function bindComposer(update){
  const q=document.getElementById('q');
  q.oninput=()=>{state.q=q.value;update()};
  document.querySelectorAll('#lic button').forEach(b=>{
    b.classList.toggle('on',b.dataset.v===state.lic);
    b.onclick=()=>{state.lic=b.dataset.v;document.querySelectorAll('#lic button').forEach(x=>x.classList.toggle('on',x===b));update()};
  });
  const p=document.getElementById('prod');
  p.onclick=()=>{state.prod=!state.prod;p.classList.toggle('on',state.prod);update()};
  update();
}
function versionLine(){const m=DATA.changelog.match(/版本：([^｜\n]+)/);return m?m[1].trim():''}

function viewEntry(id){
  const e=byId[id]; const v=document.getElementById('view');
  if(!e){v.innerHTML='<div class="empty">找不到这条提示词</div>';return}
  const sib=inFolder(e.folder); const i=sib.indexOf(e);
  const prev=sib[i-1], next=sib[i+1];
  const prompt=firstCode(e.body);
  v.innerHTML=`<article class="detail">
    <div class="crumb"><a href="#/prompts">全部</a>›<a href="#/f/${e.folder}">${esc(GROUP_LABEL[e.folder]||e.folder)}</a>›<span>${e.id}</span></div>
    <h1>${e.id}　${esc(e.title)}</h1>
    <div class="tags">${tagsHtml(e,true)}</div>
    <div class="row" style="margin-bottom:20px">
      ${prompt?`<button class="btn-white" id="cp">${ico('copy')}复制提示词正文</button>`:''}
      ${e.id==='6.0'?`<a class="btn-dark" href="#/assembler">${ico('wand')}在组装器里调整</a>`:''}
      <span class="tag tool" style="align-self:center">${esc(e.path)}</span>
    </div>
    <div class="md" id="md"></div>
    <div class="pager">${prev?`<a href="#/e/${prev.id}"><small>上一条</small>${prev.id} ${esc(prev.title)}</a>`:'<span style="flex:1"></span>'}
      ${next?`<a class="r" href="#/e/${next.id}"><small>下一条</small>${next.id} ${esc(next.title)}</a>`:'<span style="flex:1"></span>'}</div>
  </article>`;
  document.getElementById('md').appendChild(renderMd(e.body));
  if(prompt) document.getElementById('cp').onclick=ev=>copyText(prompt,ev.currentTarget);
}

function viewDoc(title, md){
  const v=document.getElementById('view');
  v.innerHTML=`<article class="detail"><div class="crumb"><a href="#/prompts">全部</a>›<span>${title}</span></div><h1>${title}</h1><div class="md" id="md"></div></article>`;
  document.getElementById('md').appendChild(renderMd(md.replace(/^# .*\n/,'')));
}

/* ---------- 6.0 assembler ---------- */
const OPT_INFO = {'成人内容':'6.0【一】第 7 条：成人镜头的详细描写要求。只用于成人线项目，全年龄线不要打开（和第七章合规红线冲突）。'};
function viewAssembler(){
  const styles=Object.keys(DATA.core.styles);
  const saved=store('asm')||{};
  const st={style:saved.style&&(saved.style==='__custom'||styles.includes(saved.style))?saved.style:styles[0],
            custom:saved.custom||'', opts:{}};
  const SEC='一二三四五六七';
  const patches={}; ENTRIES.forEach(e=>(e.patches||[]).forEach(s=>(patches[s]=patches[s]||[]).push(e)));
  const v=document.getElementById('view');
  v.innerHTML=`<div class="sec-head" style="margin-top:36px"><h2>6.0 视频专用提示词 · 组装器</h2><span class="meta">分镜表 → 每集 4~6 段长视频提示词（生产在用）</span></div>
  <div class="asm">
    <div>
      <div class="panel"><h4>统一视觉风格（第三部分）</h4>
        <span class="seg" id="sty">${styles.map(s=>`<button data-v="${esc(s)}">${esc(s)}</button>`).join('')}<button data-v="__custom">自定义</button></span>
        <textarea class="style" id="customStyle" placeholder="粘贴这个项目的画风描述，会替换【三、统一视觉风格】的正文" style="display:none">${esc(st.custom)}</textarea>
      </div>
      <div class="panel"><h4>可选条款</h4>
        ${Object.keys(DATA.core.options).map(o=>`<div class="toggle"><div class="t"><b>${esc(o)}</b><span>${esc(OPT_INFO[o]||'')}</span></div><button class="sw" data-o="${esc(o)}" aria-label="${esc(o)}"></button></div>`).join('')}
        <div class="warn" id="optWarn" style="display:none">已打开成人内容条款，请确认这是成人线项目。</div>
      </div>
      <div class="panel"><h4>可补进各部分的条目</h4><div class="plist">
        ${[...SEC].filter(s=>patches[s]).map(s=>patches[s].sort((a,b)=>cmpId(a.id,b.id)).map(e=>`<a href="#/e/${e.id}"><span class="s">【${s}】</span><span>${e.id} ${esc(e.title)}</span></a>`).join('')).join('')}
      </div></div>
    </div>
    <div>
      <div class="code" style="margin:0">
        <div class="bar"><span id="stat"></span><span class="sp"></span>
          <button class="btn-dark" id="dl" style="height:30px">${ico('dl')}下载 .txt</button>
          <button class="copy" id="cpAll">${ico('copy')}复制全部</button></div>
        <pre id="out" style="max-height:calc(100vh - 220px)"></pre>
      </div>
    </div>
  </div>`;
  const out=document.getElementById('out'), ta=document.getElementById('customStyle');
  function assemble(){
    const style = st.style==='__custom' ? st.custom : DATA.core.styles[st.style];
    let text = DATA.core.parts.join('\n');
    text = text.replace(/^\{\{OPT:([^}]+)\}\}\n?/gm,(m,n)=> st.opts[n] ? DATA.core.options[n]+(m.endsWith('\n')?'\n':'') : '');
    return text.replace('{{STYLE}}', style);
  }
  function update(){
    document.querySelectorAll('#sty button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.style));
    ta.style.display = st.style==='__custom'?'block':'none';
    document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',!!st.opts[b.dataset.o]));
    document.getElementById('optWarn').style.display = st.opts['成人内容']?'block':'none';
    const t=assemble(); out.textContent=t;
    document.getElementById('stat').textContent=`${t.length} 字 · 风格：${st.style==='__custom'?'自定义':st.style} · 可选条款：${Object.keys(st.opts).filter(k=>st.opts[k]).join('、')||'无'}`;
    store('asm',{style:st.style,custom:st.custom});
  }
  document.querySelectorAll('#sty button').forEach(b=>b.onclick=()=>{st.style=b.dataset.v;update()});
  ta.oninput=()=>{st.custom=ta.value;update()};
  document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{st.opts[b.dataset.o]=!st.opts[b.dataset.o];update()});
  document.getElementById('cpAll').onclick=e=>copyText(assemble(),e.currentTarget);
  document.getElementById('dl').onclick=()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([assemble()],{type:'text/plain;charset=utf-8'}));
    a.download='6.0视频专用提示词.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  update();
}

/* ---------- router ---------- */
function parse(){
  const h=location.hash.replace(/^#\/?/,'');
  if(h.startsWith('e/')) {const e=byId[h.slice(2)];return {view:'entry',id:h.slice(2),folder:e&&e.folder}}
  if(h.startsWith('f/')) return {view:'list',folder:h.slice(2)};
  if(h==='assembler'||h==='changelog') return {view:h};
  if(h.startsWith('script/s/')) {const [id,q]=h.slice(9).split('?');return {view:'tool',tool:'script',sub:'result',sid:id,fresh:q==='new=1'}}
  if(h==='script/new') return {view:'tool',tool:'script',sub:'new'};
  if(h.startsWith('script/w/')) return {view:'tool',tool:'script',sub:'new',wid:h.slice(9)};
  if(h.startsWith('assets/')) {const [fn,q]=h.slice(7).split('?i=');return {view:'tool',tool:'assets',fn,idx:q==null?null:+q}}
  if(h==='partner') return {view:'partner'};
  if(TOOLS[h]) return {view:'tool',tool:h};
  if(h==='prompts') return {view:'home'};
  return {view:'start'};
}
function route(){
  const r=parse(); drawNav(r);
  // 手机上每次换页都收起面板；电脑上沿用上次的展开/收起状态
  document.body.classList.toggle('ps-off', matchMedia('(max-width:760px)').matches || store('panel')===false);
  document.querySelector('.tb-logo').classList.toggle('on', r.view==='start');
  if(r.view==='start') viewScriptSimple();
  else if(r.view==='entry') viewEntry(r.id);
  else if(r.view==='assembler') viewAssembler();
  else if(r.view==='tool' && r.tool==='assets') r.fn ? viewAssetEditor(r.fn, r.idx) : viewAssets();
  else if(r.view==='tool' && r.tool==='script'){
    if(r.sub==='result') viewScriptResult(r.sid, r.fresh);
    else if(!isPro()) viewScriptSimple();
    else r.sub ? viewScriptNew(r.wid) : viewScriptHome();
  }
  else if(r.view==='tool') viewTool(r.tool);
  else if(r.view==='partner') viewPartner();
  else if(r.view==='changelog') viewDoc('更新记录', DATA.changelog);
  else viewList(r);
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
route();
</script>
