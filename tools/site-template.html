<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天玑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#101010; --bg-2:#161618; --panel:#1b1b1f; --panel-2:#222227;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#f8fafc; --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.46);
  --brand:#731dfb; --brand-2:#8b45ff; --brand-soft:rgba(115,29,251,.16);
  --yellow:#ffe000; --green:#3ddc97; --amber:#f5b94a; --red:#ff5d6c;
  --glass:linear-gradient(-17deg,rgba(214,225,255,.06),rgba(214,225,255,.11));
  --r:12px; --r-lg:18px;
  --font:Inter,"Noto Sans SC",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
a.cta,a.btn-white,a.btn-dark{text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:var(--brand);color:#fff}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:6;height:60px;display:flex;align-items:center;gap:14px;padding:0 18px 0 22px;background:rgba(13,13,13,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-logo{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px 0 8px;margin-right:4px;border-radius:12px;flex:none;text-decoration:none}
.tb-logo:hover{background:rgba(255,255,255,.06)}
.tb-logo.on{background:#2a2a2e}
.tb-logo svg{width:32px;height:32px}
.tb-name{font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
.tb-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#141416;border:1px solid var(--line)}
.tb-seg a{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;text-decoration:none;color:var(--text-2);font-size:15px;font-weight:500;white-space:nowrap}
.tb-seg a:hover{color:#fff}
.tb-seg a.on{background:#2a2a2e;color:#fff}
.tb-seg svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb-stat{font-size:14px;color:var(--text-2);white-space:nowrap}
.account{position:relative;margin-left:auto;flex:none}
.account-trigger{height:42px;display:flex;align-items:center;gap:9px;padding:0 7px 0 12px;border-radius:12px;background:#1d1d20;border:1px solid var(--line);color:#fff;font-weight:700}
.account-trigger:hover,.account-trigger[aria-expanded="true"]{background:#29292d;border-color:var(--line-2)}
.account-trigger .spark{width:17px;height:17px;fill:#fff}
.account-avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#ead9cd,#bba79b);color:#b4004e;font-size:17px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.account-panel{position:absolute;top:50px;right:0;width:390px;padding:22px 20px 16px;border-radius:20px;background:#242424;border:1px solid var(--line-2);box-shadow:0 24px 70px rgba(0,0,0,.65);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top right;transition:.16s ease;z-index:20}
.account.open .account-panel{opacity:1;visibility:visible;transform:none}
.account-head{display:flex;align-items:center;gap:14px;margin:0 6px 30px}
.account-head .account-avatar{width:58px;height:58px;font-size:28px}
.account-name{font-size:20px;font-weight:700;line-height:1.35}.account-tier{color:var(--text-2);font-size:15px}
.account-label{margin:0 6px 10px;color:var(--text-2);font-size:14px}
.space-card{display:flex;align-items:center;gap:14px;padding:12px 6px 18px;width:100%;text-align:left}
.space-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:13px;background:#4f86f7;color:#fff;font-size:25px;font-weight:800}
.space-copy{flex:1}.space-copy b{display:block;font-size:17px}.space-copy span{color:var(--text-3);font-size:14px}.space-arrow{font-size:29px;color:var(--text-3);font-weight:300}
.points-card{padding:16px 16px 14px;margin-bottom:14px;border-radius:14px;background:#303030}
.points-balance{font-size:16px;font-weight:700;margin-bottom:13px}.points-row{display:flex;align-items:center;gap:12px}.points-row span{flex:1;color:var(--text-2);font-size:13px}.upgrade{height:38px;padding:0 14px;border-radius:9px;background:#fff;color:#222;font-weight:600}.upgrade:hover{background:#ececec}
.account-menu{display:grid}.account-link{display:flex;align-items:center;gap:13px;height:50px;padding:0 8px;border-radius:10px;text-decoration:none;color:#f4f4f4;font-size:15px;text-align:left}.account-link:hover{background:rgba(255,255,255,.06)}.account-link svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.membership-page{position:fixed;inset:0;z-index:40;overflow:auto;background:#131417;color:#fff;padding:22px 30px 70px}.membership-close{position:fixed;top:18px;right:22px;z-index:42;width:56px;height:56px;border-radius:50%;background:#242426;border:1px solid var(--line-2);font-size:32px;font-weight:200}.membership-inner{max-width:1480px;margin:auto}.membership-title{text-align:center;font-size:28px;margin:0 70px 34px}.billing-row{display:flex;align-items:center;justify-content:center;gap:56px;margin-bottom:34px}.billing-tabs{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:28px;background:#1d1e22}.billing-tabs button{height:46px;border-radius:24px}.billing-tabs button.on{background:#303136}.billing-tabs small{color:#8e95a5;margin-left:5px}.billing-tabs .hot small{color:#00a8ff}.billing-links{display:flex;gap:12px;white-space:nowrap}.billing-links button.on{border:1px solid #777;border-radius:24px;padding:9px 18px}.plans{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:18px}.plan{display:flex;flex-direction:column;min-height:560px;border-radius:28px;background:#242424;border:1px solid transparent;overflow:hidden}.plan.pro{background:#0d182a;border-color:#0797ff}.plan.max{background:#1d1715;border-color:#ff6a00}.plan-ribbon{height:46px;display:grid;place-items:center;background:#0797f4;font-size:13px}.plan.max .plan-ribbon{background:#ff6900}.plan-body{display:flex;flex:1;flex-direction:column;padding:30px}.plan h2{font-size:19px;margin:0 0 12px}.plan-price{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.plan-price b{font-size:46px;line-height:1}.plan-price s{color:#9297a2}.plan-note{min-height:58px;color:#aeb4c0;font-size:13px}.plan-points{margin-top:auto;padding:16px 18px;border-radius:15px;background:rgba(255,255,255,.055)}.plan-points b{display:block}.plan-points span{color:#9ca4b2;font-size:12px}.buy-plan{height:52px;margin:20px 0;border-radius:26px;background:#fff;color:#171717}.plan.pro .buy-plan{background:#0797f4;color:#fff}.plan.max .buy-plan{background:#ff6900;color:#fff}.plan-benefits{display:grid;gap:13px;font-size:14px}.plan-benefits span::before{content:'✓';margin-right:10px}.plan-extra{margin:22px -30px -30px;padding:20px 30px;background:rgba(255,255,255,.025)}.compare{margin-top:46px}.compare h2{text-align:center;font-size:27px}.compare-scroll{overflow-x:auto}.compare-grid{min-width:900px}.compare-head,.compare-row{display:grid;grid-template-columns:1.25fr repeat(5,1fr);align-items:center}.compare-head{position:sticky;top:-22px;z-index:2;background:#131417;padding:12px 0}.compare-plan strong{display:block;font-size:30px;margin:7px 0}.compare-plan button{width:80%;height:42px;border-radius:23px;background:#f5f5f5;color:#191919}.compare-section{margin-top:30px;padding:20px 24px;border-radius:15px;background:#1e1f23;font-size:17px}.compare-row{min-height:82px;border-bottom:1px solid var(--line);padding:0 24px}.compare-row>span:not(:first-child){text-align:center}.compare-row .yes{font-size:22px}.membership-foot{text-align:center;color:#8f96a5;margin-top:48px}
.soon{max-width:560px;margin:90px auto 0;text-align:center}
.soon .big{width:88px;height:88px;margin:0 auto 22px;border-radius:24px;background:#1d1d20;border:1px solid var(--line-2);display:grid;place-items:center}
.soon .big svg{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.soon h1{font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:30px;margin:0 0 10px}
.soon p{color:var(--text-2);margin:0 0 24px}

/* ---------- shell: rail + collapsible panel + main ---------- */
.shell{display:flex;min-height:calc(100vh - 60px)}

.pside{position:sticky;top:60px;height:calc(100vh - 60px);width:264px;flex:none;overflow:auto;scrollbar-width:none;border-right:1px solid var(--line);background:#111113;padding:16px 12px 24px;transition:width .2s,padding .2s}
body.ps-off .pside{width:0;padding:0;border-right:0;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 16px;border-radius:12px;background:#1d1d20;border:1px solid var(--line);color:#e9e9ee;font-size:15px;white-space:nowrap}
.pill:hover{background:#26262a}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.ps-float{position:absolute;top:24px;left:26px;z-index:4;display:none;align-items:center;gap:8px}
body.ps-off .ps-float{display:flex}
.ps-row{display:flex;align-items:center;gap:8px}
.pro{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 12px;border-radius:12px;background:#1d1d20;border:1px solid var(--line);color:var(--text-2);font:800 13px/1 Inter,var(--font);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.pro:hover{background:#26262a}
.pro .sw{width:34px;height:20px}
.pro .sw::after{width:14px;height:14px}
.pro .sw.on::after{transform:translateX(14px)}
.pro.on{color:#fff}
.pro.on b{background:linear-gradient(90deg,#b98bff,#3fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pro em{font-style:normal;font-weight:500;font-size:12px;color:var(--text-3)}
.ps-title{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--text-3);padding:18px 10px 6px}
.ps-title svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pside a{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;text-decoration:none;color:var(--text-2);font-size:13.5px;line-height:1.45}
.pside a:hover{background:rgba(255,255,255,.05);color:#fff}
.pside a.on{background:#232326;color:#fff}
.pside a .i{flex:none;min-width:30px;font:600 12px Inter,monospace;color:var(--text-3)}
.pside a .n{margin-left:auto;font-size:11px;color:var(--text-3)}
.pside a.head{color:#fff;font-weight:600;font-size:14px}
.pside::-webkit-scrollbar{display:none}
.pside a.fn{align-items:center}
.pside a svg{flex:none;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;align-self:center}
.pside a.sub{padding-left:37px}
.pside a .d{display:block;font-size:12px;color:var(--text-3);margin-top:1px}
.pside .ptag{margin-left:auto;flex:none;align-self:center;padding:2px 7px;border-radius:6px;background:var(--brand);color:#fff;font:800 10px/1.4 Inter,var(--font);letter-spacing:.04em}
.pside .ps-hr{height:1px;background:var(--line);margin:14px 6px 4px}

main{position:relative;flex:1;min-width:0;background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px}
body.ps-off main .wrap{padding-top:56px}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px 80px}
.hero{position:relative;overflow:hidden;padding:64px 0 34px;text-align:center;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40% -10% 0;z-index:-1;
  background:radial-gradient(closest-side at 50% 55%,rgba(170,20,40,.35),transparent 70%),radial-gradient(closest-side at 70% 30%,rgba(115,29,251,.22),transparent 70%)}
.hero .rings{position:absolute;left:50%;top:52%;width:640px;height:640px;transform:translate(-50%,-50%);z-index:-1;opacity:.35}
.hero h1{margin:0 auto;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.15;letter-spacing:.02em;
  background:linear-gradient(90deg,#aeb4be 0%,#f2f4f7 28%,#fff 50%,#f2f4f7 72%,#aeb4be 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--text-2);margin:14px auto 0;max-width:560px}

.composer{margin:28px auto 0;max-width:760px;text-align:left;border-radius:var(--r-lg);border:1px solid var(--line-2);background:rgba(22,22,26,.82);backdrop-filter:blur(12px);padding:14px 16px 14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.composer .top{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase}
.search{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.search svg{width:18px;height:18px;stroke:var(--text-3);fill:none;stroke-width:2}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:15px var(--font)}
.search input::placeholder{color:var(--text-3)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:30px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button.on{background:#fff;color:#111214}
.chip-btn{height:36px;padding:0 14px;border-radius:999px;background:var(--glass);color:var(--text-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip-btn.on{color:#fff;box-shadow:inset 0 0 0 1px var(--brand-2);background:var(--brand-soft)}
.chip-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.sec-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:44px 0 16px}
.sec-head h2{margin:0;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:26px}
.sec-head .meta{color:var(--text-3);font-size:13px}
.sec-head .sp{flex:1}
.btn-white{height:40px;padding:0 16px;border-radius:10px;background:#fff;color:#111;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn-dark{height:40px;padding:0 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:#fff;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn-white svg,.btn-dark svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:168px;padding:16px;border-radius:var(--r-lg);background:linear-gradient(180deg,#1c1c20,#151517);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.card:hover{border-color:rgba(139,69,255,.6);transform:translateY(-2px)}
.card .id{font:600 12px/1 Inter,monospace;color:var(--text-3)}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.45}
.card .desc{color:var(--text-3);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.card .tl{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--text-2);white-space:nowrap}
.tag.prod{background:var(--yellow);color:#111}
.tag.ref{background:rgba(245,185,74,.14);color:var(--amber)}
.tag.int{background:var(--brand-soft);color:#c9a8ff}
.tag.patch{background:rgba(61,220,151,.12);color:var(--green)}
.tag.tool{background:rgba(255,255,255,.05);color:var(--text-3)}
.empty{padding:60px 0;text-align:center;color:var(--text-3)}

/* ---------- detail ---------- */
.detail{max-width:860px;margin:0 auto;padding:36px 0 0}
.crumb{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:13px;margin-bottom:18px;flex-wrap:wrap}
.crumb a{text-decoration:none}.crumb a:hover{color:#fff}
.detail h1{font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(24px,3.4vw,34px);line-height:1.3;margin:0 0 12px}
.detail .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.md{color:var(--text-2);font-size:14.5px;line-height:1.8}
.md strong{color:#fff}
.md h2,.md h3,.md h4{color:#fff;margin:28px 0 10px}
.md a{color:#c9a8ff}
.md blockquote{margin:14px 0;padding:12px 16px;border-radius:var(--r);background:var(--brand-soft);border:1px solid rgba(139,69,255,.35);color:#e6dbff}
.md blockquote p{margin:0}
.md table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel);color:#fff}
.md code{font-family:ui-monospace,Consolas,monospace;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px;font-size:.92em}
.code{position:relative;margin:16px 0;border-radius:var(--r-lg);border:1px solid var(--line-2);background:#0b0b0d;overflow:hidden}
.code .bar{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-3)}
.code .bar .sp{flex:1}
.code pre{margin:0;padding:16px;max-height:520px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.75 "Noto Sans SC",ui-monospace,Consolas,monospace;color:#e9e9ee}
.copy{height:30px;padding:0 12px;border-radius:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.copy:hover{background:var(--brand-2)}
.copy.done{background:var(--green);color:#062}
.copy svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.pager{display:flex;gap:12px;margin-top:40px}
.pager a{flex:1;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);text-decoration:none;background:var(--bg-2)}
.pager a:hover{border-color:var(--brand-2)}
.pager small{display:block;color:var(--text-3);font-size:12px}
.pager .r{text-align:right}

/* ---------- assembler ---------- */
.asm{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:8px;align-items:start}
.panel{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg-2);padding:16px}
.panel h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.panel + .panel{margin-top:14px}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle .t{flex:1}
.toggle .t b{display:block;font-size:13.5px}
.toggle .t span{font-size:12px;color:var(--text-3)}
.sw{position:relative;width:38px;height:22px;flex:none;border-radius:99px;background:rgba(255,255,255,.14);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--brand)}
.sw.on::after{transform:translateX(16px)}
.warn{margin-top:8px;font-size:12px;color:var(--amber)}
textarea.style{width:100%;min-height:150px;margin-top:10px;resize:vertical;border-radius:10px;border:1px solid var(--line);background:#0b0b0d;color:var(--text);padding:10px;font:12.5px/1.7 var(--font)}
.plist a{display:flex;gap:8px;padding:6px 0;text-decoration:none;font-size:13px;color:var(--text-2);border-top:1px dashed var(--line)}
.plist a:hover{color:#fff}
.plist .s{flex:none;width:28px;color:var(--green);font-weight:700}
.stat{display:flex;gap:18px;font-size:12px;color:var(--text-3);margin-bottom:10px}
.stat b{color:#fff;font-size:14px}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#111;padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;transition:.2s;pointer-events:none;z-index:9}

/* ---------- 资产库 ---------- */
.as-title{text-align:center;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(24px,3vw,32px);margin:56px 0 28px}
.as-cards{display:grid;grid-template-columns:repeat(2,minmax(0,340px));justify-content:center;gap:22px}
.mcard{position:relative;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,#1a1a1d,#131315);padding:26px 18px 0;min-height:430px}
.mcard:hover{z-index:5}
.mcard.r .pop{left:auto;right:calc(100% - 24px);transform:translate(-8px,-50%)}
.mcard.r .mi:hover .pop{transform:translate(0,-50%)}
.stackwrap{position:absolute;left:0;right:0;bottom:0;height:180px;overflow:hidden;border-radius:0 0 26px 26px;pointer-events:none}
.mcard h3{margin:0 0 14px 14px;font-size:16px;font-weight:500;color:var(--text-3)}
.mi{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:14px;color:#f2f2f2;font-size:17px;font-weight:500;text-align:left}
.mi:hover{background:rgba(255,255,255,.06)}
.mi svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pop{position:absolute;left:calc(100% - 24px);top:50%;transform:translate(8px,-50%);width:250px;opacity:0;pointer-events:none;z-index:20;
  border-radius:16px;background:#2b2b2f;border:1px solid var(--line-2);box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden;transition:opacity .12s,transform .12s}
.mi:hover .pop{opacity:1;transform:translate(0,-50%)}
.pop .pv{height:130px;background:#1a1a1d}
.pop p{margin:0;padding:10px 12px 12px;font-size:13px;line-height:1.55;color:#eee}
.pv{display:grid;gap:4px;padding:8px}
.pv i{display:grid;place-items:center;border-radius:6px;background:var(--g,linear-gradient(160deg,#3a4a5e,#20242c));font-style:normal}
.pv i svg{width:22px;height:22px;stroke:rgba(255,255,255,.75);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stack{position:absolute;left:50%;bottom:-26px;width:220px;height:150px;transform:translateX(-50%);pointer-events:none}
.stack b{position:absolute;bottom:0;width:120px;height:150px;border-radius:18px;border:3px solid #2a2a2e;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.stack b svg{width:46px;height:46px;stroke:rgba(255,255,255,.8);fill:none;stroke-width:1.4}
.stack b:nth-child(1){left:6px;transform:rotate(-14deg);background:linear-gradient(160deg,#5b6b56,#2d3a33)}
.stack b:nth-child(2){left:52px;transform:rotate(-5deg);background:linear-gradient(160deg,#6d5a48,#2f2722)}
.stack b:nth-child(3){left:98px;transform:rotate(6deg);background:linear-gradient(160deg,#7f8fa6,#3a4456)}

.mine{margin-top:56px}
.mine .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.acard{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line);background:#151517}
.acard .t{display:flex;gap:8px;align-items:center;font-weight:700}
.acard .t svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.acard .s{font-size:12px;color:var(--text-3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.acard .row button{height:30px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.07);font-size:12px}
.acard .row button:hover{background:rgba(255,255,255,.12)}

/* 节点编辑器（下一层） */
.ed-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:30px 0 18px}
.ed-head h2{margin:0;font-size:20px;font-weight:700}
.ed-head .d{color:var(--text-3);font-size:13px}
.graph{position:relative;display:grid;grid-template-columns:240px 1fr 300px;align-items:center;gap:0;min-height:300px}
.inputs{display:flex;flex-direction:column;gap:14px;z-index:1}
.node{border-radius:16px;border:1px solid var(--line-2);background:#18181b;padding:10px}
.node .nh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:8px}

.wires{position:absolute;inset:0;pointer-events:none}
.outnode{grid-column:3;z-index:1}

.outnode .res .pv{height:100%;padding:0}
a.pill{text-decoration:none}
.outnode .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:8px}

.composer2{margin:22px auto 0;max-width:820px;border-radius:22px;border:1px solid var(--line-2);background:#1b1b1e;padding:14px 16px 12px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.slots{display:flex;gap:8px;margin-bottom:10px}
.slot{width:48px;height:48px;border-radius:12px;background:#26262a;display:grid;place-items:center;font-size:11px;color:var(--text-2);overflow:hidden;position:relative}
.slot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.slot img{width:100%;height:100%;object-fit:cover;opacity:.85}
.slot span{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.composer2 textarea{width:100%;min-height:120px;resize:vertical;border:0;outline:0;background:none;color:var(--text);font:14px/1.75 var(--font)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.ck{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#26262a;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.ck.on{background:var(--brand-soft);color:#fff;box-shadow:inset 0 0 0 1px var(--brand-2)}
.tools2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative}
.tb{height:34px;padding:0 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#e9e9ee}
.tb:hover{background:rgba(255,255,255,.07)}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.tb select{background:none;border:0;color:inherit;font:inherit;outline:0;cursor:pointer}
.tb select option{background:#1b1b1e}
.tools2 .sp{flex:1}
.go{width:38px;height:38px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.go.done{background:var(--green)}
.stylepop{position:absolute;left:0;bottom:calc(100% + 10px);width:min(560px,92vw);border-radius:18px;border:1px solid var(--line-2);background:#202024;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:12px;z-index:30;display:none}
.stylepop.open{display:block}
.stylepop .sh{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;color:var(--text-3)}
.stylepop .sh svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.stylepop .sh input{flex:1;background:none;border:0;outline:0;color:var(--text);font:14px var(--font)}
.stabs{display:flex;gap:16px;padding:0 8px 10px;font-size:14px;color:var(--text-3)}
.stabs button.on{color:#fff;font-weight:700}
.stabs .sp{flex:1}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:260px;overflow:auto;padding:0 4px 4px}
.stile{text-align:left;font-size:12px;color:var(--text-2)}
.stile i{display:grid;place-items:center;height:72px;border-radius:12px;margin-bottom:6px;border:2px solid transparent;font-style:normal}
.stile.on i{border-color:#fff}
.stile i svg{width:24px;height:24px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.6}

/* ---------- 剧本：新增作品五步 ---------- */
.wz-head{margin:30px 0 22px}
.chat{max-width:980px;margin:0 auto}
.cstat{text-align:center;margin-bottom:14px}
.cs-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.cs{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;font-size:13.5px;background:rgba(224,160,64,.1);border:1px solid rgba(224,160,64,.28)}

.cs-btn{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:10px;border:1px solid rgba(224,160,64,.55);color:#f2c27a;font-size:13.5px;text-decoration:none}

.cs-hint{margin-top:8px;font-size:12px;color:var(--text-3)}
.conn{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:#1d1d20;border:1px solid transparent;color:var(--text-2);font:600 14px Inter,var(--font)}
.cn svg{width:20px;height:20px}
.cn:hover{color:#fff}
.cn.on{background:#26262a;border-color:var(--line-2);color:#fff}
.cbox{border-radius:26px;border:1px solid var(--line-2);background:#1a1a1c;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ctabs{display:flex;background:#232326;border-radius:26px 26px 0 0;overflow:hidden}
.ctabs button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:58px;color:var(--text-2);font-size:15px;white-space:nowrap}
.ctabs button:hover{color:#fff}
.ctabs button.on{background:#1a1a1c;color:#fff;border-radius:22px 22px 0 0}
.ctabs svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cbody{padding:22px 26px 6px}
.cdrop{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 16px 34px;border:1.5px dashed rgba(255,255,255,.16);border-radius:18px}
.cdrop.over{border-color:var(--brand-2);background:var(--brand-soft)}
.cards3{position:relative;width:120px;height:90px}
.cards3 i{position:absolute;width:52px;height:72px;border-radius:6px;background:#3a3a3e;border:1px solid rgba(255,255,255,.12);top:10px;left:18px;transform:rotate(-8deg)}
.cards3 i+i{left:52px;top:4px;transform:rotate(4deg);background:#4a4a4f;display:grid;place-items:start center;padding-top:6px}

.cards3 em{position:absolute;right:2px;top:-4px;width:30px;height:30px;border-radius:50%;background:#4a4a4f;color:#fff;font:400 22px/30px Inter;text-align:center;font-style:normal;border:1px solid rgba(255,255,255,.15)}
.cdrop .note{display:inline-flex;align-items:center;gap:4px;color:var(--text-3);font-size:14px}
.cdrop .tip{display:inline-flex}
.cdrop .tip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;cursor:help}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.cdrop .crow{margin:0}
.cpill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 18px;border-radius:12px;background:#2c2c30;color:#fff;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.cpill:hover{background:#36363b}
.cpill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.cta{display:block;width:100%;min-height:150px;resize:vertical;border-radius:14px;border:1px solid var(--line-2);background:#141416;color:#fff;padding:14px 16px;font:14.5px/1.7 var(--font)}
.cta:focus{outline:none;border-color:rgba(139,69,255,.6)}
.cnt{font-size:12.5px;color:var(--text-3)}
.cnt.bad{color:#ff8a9a}
.cdesc{margin:0 0 12px;color:var(--text-2);font-size:14px;line-height:1.75}
.cdesc b{color:#fff}
.crecent{margin-top:14px;color:var(--text-3);font-size:13.5px}
.crecent summary{cursor:pointer}
.crecent .ri2{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.crecent .ri2 .cpill{height:32px;padding:0 12px;font-size:13px}
.crecent .ri2 b{color:#fff}
.cfoot{display:flex;align-items:center;gap:6px;padding:12px 18px 16px}
.cbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;color:#fff;font-size:15px}
.cbtn:hover{background:rgba(255,255,255,.06)}
.cbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.cpop-w{position:relative}
.cpop{position:absolute;left:0;bottom:calc(100% + 8px);z-index:20;display:none;flex-direction:column;min-width:190px;max-height:300px;overflow:auto;padding:6px;border-radius:14px;background:#1d1d20;border:1px solid var(--line-2);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cpop.open{display:flex}
.cpop button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--text-2);font-size:13.5px;text-align:left}
.cpop button:hover,.cpop button.on{background:#2a2a2e;color:#fff}
.cpop i{flex:none;width:22px;height:22px;border-radius:6px}
.cbtn i.rb{display:inline-block;flex:none;border:1.6px solid currentColor;border-radius:3px;margin:0 1px}
.cpop i.rb{width:auto;height:18px;border:1.5px solid currentColor;border-radius:3px}
.csend{margin-left:auto;width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.csend:disabled{background:#3a3a3e;color:#8a8a90;cursor:not-allowed}
.csend svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wz-head .crumb{margin-bottom:6px}
.wz-head h1{margin:0;font-family:"Noto Sans SC",var(--font);font-weight:900;font-size:clamp(24px,3vw,32px)}
.wz-head p{margin:6px 0 0;color:var(--text-2)}
.wz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.step{border-radius:22px;border:1px solid var(--line);background:rgba(21,21,23,.92);padding:20px 22px;margin-bottom:16px}
.step h3{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:17px}

/* 四大功能共用的步骤数字：紫底数字 = 步骤 / 当前，黑底数字 = 未完成，紫底打勾 = 完成 */
.sn{flex:none;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:#2a2a2e;color:var(--text-2);font:700 12px/1 Inter,var(--font);font-style:normal}
.sn.on,.sn.done{background:var(--brand);color:#fff}
.sn svg{width:62%;height:62%;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cbox.vibe{border-color:rgba(139,69,255,.35);background:linear-gradient(180deg,rgba(139,69,255,.10),#151517 45%)}
.cbox.vibe .cbody{padding:22px 26px 24px}
.cbox.vibe .ctabs button.on{background:#211a2e}
.cbox.vibe .wcard{position:relative;max-width:none;margin:0;padding:0;border:0;border-radius:0;background:none}
.cbox.vibe .wc-x{top:-8px;right:-10px}
.cpop.down{bottom:auto;top:calc(100% + 8px)}
.wcard{position:relative;max-width:720px;margin:0 auto 40px;border-radius:22px;border:1px solid rgba(139,69,255,.35);background:linear-gradient(180deg,rgba(139,69,255,.10),#151517 45%);padding:24px 26px}
.wc-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}
.wc-x:hover{background:#26262a;color:#fff}
.wc-x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.wc-title{padding:0 36px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:800;color:#fff}
.wc-title input{field-sizing:content;flex:0 1 auto;min-width:1em;max-width:100%;background:transparent;border:0;outline:0;color:#fff;font:inherit;text-align:center;padding:2px 4px}
.wc-title input::placeholder{color:var(--text-3)}
.wc-story{display:block;width:100%;margin-top:12px;border:1px solid var(--line-2);border-radius:14px;background:#0f0f11;color:#fff;font:16px/1.7 var(--font);padding:12px 14px;resize:vertical;outline:0}
.wc-story:focus{border-color:rgba(139,69,255,.6)}
.cpop .qx{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(139,69,255,.25);color:#d9c8ff;font:600 11px Inter,var(--font);font-style:normal}
.wc-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.psel span{font:600 14px var(--font);white-space:nowrap}
.psel>svg:last-child{width:12px;height:12px;stroke:var(--text-3);stroke-width:2}
.psel i.rb{display:inline-block;border:1.6px solid currentColor;border-radius:3px}
.psel{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 14px;border-radius:999px;background:#232326;border:1px solid var(--line);color:#fff;cursor:pointer}
.psel svg{width:14px;height:14px;stroke:#b896ff;fill:none;stroke-width:1.8}
.psel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:#fff;font:600 14px var(--font);outline:0;cursor:pointer;padding:0 8px 0 0}
.psel select option{background:#1b1b1e;color:#fff}
.psel:hover{border-color:rgba(139,69,255,.6)}
.wc-hooks{margin-top:12px}

.wc-idea-h svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.wc-seeds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.wc-seed:hover{background:#2f2a3a;color:#fff}
.wc-say{position:relative}
.mic-w{position:relative}
.mic-w .has-mic{padding-right:54px}

async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text) }
  catch(e){ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove() }
  toast('已复制到剪贴板');
  if(btn){btn.classList.add('done');const h=btn.innerHTML;btn.innerHTML=ico('check')+'已复制';setTimeout(()=>{btn.classList.remove('done');btn.innerHTML=h},1300)}
}
function zipCrc(bytes){let c=-1;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
  const u16=n=>new Uint8Array([n&255,n>>>8&255]), u32=n=>new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255]);
  for(const f of files){const name=enc.encode(f.name),data=enc.encode(f.text),crc=zipCrc(data),head=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);parts.push(head,data);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]));offset+=head.length+data.length}
  const csize=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(offset),...u16(0)]);return new Blob([...parts,...central,end],{type:'application/zip'});
}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function firstCode(md){const m=md.match(/```[^\n]*\n([\s\S]*?)\n```/);return m?m[1]:''}
function usage(md){const m=md.match(/\*\*用法\*\*[:：]\s*([^\n]+)/);return m?m[1].replace(/[*`]/g,''):''}
function licClass(l){return l.startsWith('内部')?'int':l.includes('仅参考')?'ref':''}
function tagsHtml(e, full){
  const t=[];
  if(e.status) t.push(`<span class="tag prod">${esc(full?e.status:(e.status.includes('已用于生产')?'已用于生产':e.status.slice(0,10)))}</span>`);
  t.push(`<span class="tag ${licClass(e.license)}">${esc(e.license)}</span>`);
  if(e.patches) t.push(`<span class="tag patch">补 6.0【${e.patches.join('】【')}】</span>`);
  if(e.tool) t.push(`<span class="tag tool">适用 ${esc(e.tool)}</span>`);
  return t.join('');
}
function renderMd(md){
  let html;
  if(window.marked){ html = marked.parse(md, {gfm:true, breaks:false}) }
  else { html = '<pre style="white-space:pre-wrap">'+esc(md)+'</pre>' }
  const box=document.createElement('div');box.innerHTML=html;
  box.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  box.querySelectorAll('pre').forEach(pre=>{
    const code=pre.textContent;
    const w=document.createElement('div');w.className='code';
    w.innerHTML=`<div class="bar">${ico('copy').replace('<svg','<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"')}提示词正文 · ${code.length} 字<span class="sp"></span><button class="copy">${ico('copy')}复制</button></div><pre></pre>`;
    w.querySelector('pre').textContent=code;
    w.querySelector('.copy').onclick=e=>copyText(code,e.currentTarget);
    pre.replaceWith(w);
  });
  return box;
}

        return `<path d="M${x1} ${y1} C${x1+c} ${y1} ${x2-c} ${y2} ${x2} ${y2}" fill="none" stroke="url(#wg)" stroke-width="2.2" opacity=".85"/>`}).join('')+

    c.classList.toggle('on');refresh()});
  $('sbtn').onclick=e=>{e.stopPropagation();$('spop').classList.toggle('open');drawStyles()};
  $('spop').onclick=e=>e.stopPropagation();
  document.addEventListener('click',()=>$('spop')&&$('spop').classList.remove('open'));
  document.querySelectorAll('#stabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;drawStyles()});
  $('sq').oninput=drawStyles;
  $('save').onclick=()=>{
    const list=store('assets')||[]; const {imgs,...keep}=st;
    const item={fn:f.id,name:st.name,prompt:$('prompt').value,state:keep,time:Date.now()};
    if(saved) list[idx]=item; else list.unshift(item);

      if(sd.items.every(x=>x.done)){ toast('资产都齐了，下一步：分镜'); setTimeout(()=>{ location.hash=seedBoard(sd); }, 900); } }
  };

async function readAnyFile(file){
  const name=file.name.toLowerCase(), buf=await file.arrayBuffer();
  const loadJs=src=>new Promise((ok,bad)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error('载入失败')); document.head.appendChild(s); });
  if(name.endsWith('.docx')){
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({arrayBuffer:buf})).value;
  }
  if(name.endsWith('.pdf')){
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:buf}).promise; const out=[];
    for(let i=1;i<=pdf.numPages;i++){ const c=await (await pdf.getPage(i)).getTextContent(); out.push(c.items.map(x=>x.str+(x.hasEOL?'\n':'')).join('')); }
    return out.join('\n');
  }
  // txt / md：依序试 UTF-8、GB18030、Big5
  for(const enc of ['utf-8','gb18030','big5']){ try{ return new TextDecoder(enc,{fatal:true}).decode(buf).replace(/^﻿/,''); }catch(e){} }
  return new TextDecoder('utf-8').decode(buf);
}

const WC_SEEDS=['主角的秘密是','最大的反转是','金手指是','对手是','结局想要'];
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
/* 语音转文字：接在输入框原文后面，边说边出字 */
function micListen(btn, ta, sep){
  if(btn._rec){ btn._rec.stop(); return; }
  if(!SpeechRec||!ta) return;
  const rec=new SpeechRec(); rec.lang='zh-CN'; rec.interimResults=true; rec.continuous=true;
  const base=ta.value.replace(/\s+$/,''), join = !base ? '' : sep!=null ? sep : (/[，。！？、,.!?\n]$/.test(base)?'':'，');
  btn._rec=rec; btn.classList.add('on');
  rec.onresult=e=>{ let t=''; for(const r of e.results) t+=r[0].transcript; ta.value=base+join+t; ta.dispatchEvent(new Event('input',{bubbles:true})); };
  rec.onend=rec.onerror=()=>{ btn._rec=null; btn.classList.remove('on'); };
  try{ rec.start(); }catch(err){ btn._rec=null; btn.classList.remove('on'); toast('这个浏览器不支持语音输入'); }
}
function addMic(ta){
  if(!SpeechRec||!ta||ta.parentElement.classList.contains('mic-w')) return;
  const w=document.createElement('div'); w.className='mic-w'; ta.before(w); w.append(ta); ta.classList.add('has-mic');
  const b=document.createElement('button'); b.type='button'; b.className='wc-mic'; b.title='用说的'; b.innerHTML=ico('mic');
  b.onclick=e=>{ e.preventDefault(); micListen(b, ta); }; w.append(b);
}
function wzRollTitle(W, prev){
  const p=(W.pitch||'').trim();
  const nm=(p.match(/^([一-龥]{2,3}?)(?:变成|穿成|穿越|重生|成了|是|被|靠|在|的)/)||[])[1];
  const KW=['千金','嫡女','庶女','王妃','皇后','女帝','公主','郡主','世子','王爷','将军','少帅','总裁','首富','神医','战神','赘婿','影后','保镖','秘书','娇妻','大佬','师尊','掌门','仙尊'];
  const k=KW.find(x=>p.includes(x));
  const T=[];
  if(k) T.push(`${k}归来`,`${k}不好惹`,`重生之${k}`,`这个${k}有点狠`,`${k}的逆袭`,`惊鸿${k}`,`${k}今天也在翻盘`,`锦绣${k}`,`我家${k}是大佬`,`${k}她杀疯了`);
  if(nm) T.push(`${nm}传`,`${nm}的逆袭`,`${nm}不好惹`,`${nm}，开挂了`);
  if(k && /古代|穿/.test(p)) T.push(`穿成${k}后`,`${k}穿越记`,`一觉醒来成了${k}`);
  if(/重生/.test(p)) T.push('重生之后，我不忍了','重来一次，全都还回来');
  if(/系统|读心|异能|金手指/.test(p)) T.push('开局就有金手指','我能听见你的心声','系统逼我当大佬');
  if(!T.length) T.push('逆风翻盘','一路开挂','人生重启','命运反转','爽到最后','她杀疯了','惊鸿一瞥','这次换我赢');
  const pool=T.filter(x=>x!==prev);
  return pool[Math.floor(Math.random()*pool.length)];
}

function wzGuess(t){
  const g={}, has=re=>re.test(t);
  if(has(/男男|耽美|BL/i)) g.pair='男男（BL）'; else if(has(/女女|百合|GL/i)) g.pair='女女（GL）';
  if(g.pair==='男男（BL）') g.aud='女性向';
  else if(has(/千金|王妃|皇后|嫡女|女主|她|闺蜜|婆婆|前夫/)) g.aud='女性向';
  else if(has(/战神|兵王|赘婿|神医|他|少年|废柴|老板/)) g.aud='男性向';
  g.genre = has(/重生|穿越|穿成|回到/) ? '重生穿越' : has(/系统|异能|读心|透视/) ? '能力系统' : has(/修仙|仙|魔|妖|玄/) ? '玄幻'
    : has(/古代|王府|宫|皇|将军|侯府|嫡/) ? '古装' : has(/总裁|霸总|豪门|首富/) ? '霸总' : has(/公司|职场|上司|同事/) ? '职场' : '都市';
  const h=[]; if(has(/千金|身份|身分|假|真/)) h.push('身分反转'); if(has(/逆袭|翻盘|崛起/)) h.push('逆袭'); if(has(/打脸|嘲笑|看不起/)) h.push('打脸');
  if(has(/追妻|火葬场/)) h.push('追妻'); if(has(/先婚|契约|闪婚/)) h.push('先婚后爱'); if(has(/重逢|前任|破镜/)) h.push('破镜重圆'); if(has(/宠|偏爱/)) h.push('被偏爱');
  g.hooks=h; return g;
}

function wzSaveWork(W, kind){
    const p=(W.pitch||'').trim().replace(/[，。！？,.!?].*$/,'');
    const title=wzTitle(W)||(p?p.slice(0,14):'未命名');
    const list=store('works')||[]; const {dup,guessed,...keep}=W;
    const old=list.find(x=>x.id===W.id);
    const item={...(old||{}), id:W.id||('w'+Date.now().toString(36)), title, W:{...keep,id:undefined}, time:Date.now()};
    if(kind) item.kind=kind;
    const i=list.findIndex(x=>x.id===item.id); if(i>=0) list[i]=item; else list.unshift(item);

function wzCreate(W){
    const item=wzSaveWork(W), title=item.title;

function wzSeedAssets(W, item){
    const title=item.title;
    // 把作品里的主角、对手、场景带到资产库，点一下就能开始做角色设定板 / 场景设定板
    const core=[W.pitch,W.core].filter(x=>x&&x.trim()).join('；');

    const leads = pair.startsWith('男男') ? ['男主','男主 CP'] : pair.startsWith('女女') ? ['女主','女主 CP']
      : W.aud==='女性向' ? ['女主','男主'] : ['男主','女主'];
    const seed=[
      {fn:'role-board', label:leads[0], name:leads[0], profile:[W.hero.trim(), core].filter(Boolean).join('；')},
      {fn:'role-board', label:leads[1], name:leads[1], profile:`${leads[0]}的感情线对象。${core}`},
      {fn:'role-board', label:'对手', name:'对手', profile:W.rival.trim()},
      {fn:'scene-board', label:'主要场景', name:'主要场景', profile:W.world.trim()||[W.genre,core].filter(Boolean).join('；')},
    ].filter(x=>x.profile||x.label!=='对手');
    store('assetSeed',{wid:item.id, title, items:seed});

    location.hash='#/assets';
}

const AI_SITES={Claude:'https://claude.ai/new', ChatGPT:'https://chatgpt.com/', Grok:'https://grok.com/', Qwen:'https://chat.qwen.ai/'};
const vibeLeads = W => { const p=W.pair||'男女';
  return p.startsWith('男男') ? ['男主','男主 CP'] : p.startsWith('女女') ? ['女主','女主 CP'] : W.aud==='女性向' ? ['女主','男主'] : ['男主','女主']; };
function vibeSx(w){
  const W=Object.assign({}, WZ_DEF, w.W), leads=vibeLeads(W), g=leads[0].startsWith('女')?'female':'male';
  const pitch=(W.pitch||'').trim();
  const m=pitch.match(/^([一-龥]{2,3}?)(?:变成|穿成|穿越|重生|成了|是|被|靠|在|的)/);
  const name = w.vname || (m && m[1]) || pick(SX_NAMES[g]);
  const t={type:`${W.genre} · ${leads[0]}`, surface:pitch.split(/[，,。]/)[0]||W.genre, hidden:(W.core||'').trim().split('\n')[0]||'一张没人知道的底牌',
    gold:W.qxMode||W.hooks[0]||'身分反转', hook:pitch, rel:`${name}-${(W.rival||'').trim()||'对手'}`, genres:[W.genre,...W.hooks].join('、'), note:(W.core||'').trim()};
  const g2 = leads[1].startsWith('女')?'female':'male', pool=SX_NAMES[g2].filter(x=>x!==name);
  const name2 = w.vname2 || pool[(w.seed||1)%pool.length];
  return {id:w.id, title:w.title, name, name2, g, role:t, seed:w.seed||1, outline:sxOutline(t,name,g), idea:(W.core||'').trim(), leads, W};
}
/* 一集用到的素材：出场人物 + 场景 */
function epMat(t){
  const people=new Set(), locs=new Set();
  for(const m of t.matchAll(/^出场人物：(.+)$/gm)) m[1].split(/[、，,]/).map(x=>x.trim()).filter(Boolean).forEach(x=>people.add(x));
  for(const m of t.matchAll(/^场景：[^·]*·\s*([^·\n]+?)\s*·/gm)) locs.add(m[1]);
  for(const m of t.matchAll(/^#{2,4}\s*场\s*\d+\s*[｜|]\s*([^（(\n]+)/gm)) locs.add(m[1].trim());
  for(const m of t.matchAll(/^([一-龥]{2,5})(?:（[^）]*）)?：[「“]/gm)) people.add(m[1]);
  return {people:[...people], locs:[...locs]};
}

function genReq(W0){

    chars_per_episode:Math.min(1300,Math.max(400,Math.round(mins*400))), explicit_ratio:[0,0]};
  const core=(W.core||'').trim(); if(core) req.theme=core;

function genParse(r){

  const eps=[]; (x.episodes||[]).forEach((e,i)=>{ eps[(e.ep||i+1)-1]=e.text||''; });
  const cast=[]; for(const m of String(x.cards||'').matchAll(/\*\*([^*（(]+)[（(]([^)）]+)[)）]\*\*\s*\n([\s\S]*?)(?=\n\s*\*\*|$)/g)) cast.push({name:m[1].trim(), role:m[2].trim(), bio:m[3].trim()});
  return {title:fw.title||x.title||'', logline:fw.logline||'', outline, eps, cast};
}

/* 逐集写：先出大纲（快模型），再一集一集写（主写模型）；离开页面会停，回来接着写 */
const YQ_PLAN='deepseek-v41-flash-uncensored', YQ_WRITE='sealion-nova-pro';
const YQ_RULES='【底线】所有角色都是 20 岁以上的成年人，不写学生、校园或未成年暗示；不写血亲、继亲、姻亲之间的感情或亲密；亲密戏必须看得出双方清楚自愿，不写醉酒、昏迷、催眠、下药或威胁下的亲密；不对应真实人物，不用知名作品的角色名；不碰时事政治。亲密戏点到为止，不写露骨细节。';
async function yqChat(model, content, max_tokens){
  const r=await fetch(TJ_API+'/yq/v1/chat/completions',{method:'POST', headers:{'X-Tianji-Code':tjCode()||'','Content-Type':'application/json'},
    body:JSON.stringify({model, messages:[{role:'user',content}], max_tokens:max_tokens||3000, temperature:0.8})});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&(j.error.message||j.error))||('HTTP '+r.status));
  return String(((j.choices||[])[0]||{}).message?.content||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
}
function yqPlanPrompt(W, n){
  const x=[`一句话故事：${(W.pitch||'').trim()}`, `受众：${W.aud}`, `配对：${W.pair}`, `题材：${W.genre}`];
  if(W.qxRole) x.push(`核心角色类型：${W.qxRole}`); if(W.qxMode) x.push(`剧本模式：${W.qxMode}`);
  if((W.hooks||[]).length) x.push(`爽点：${W.hooks.join('、')}`); if((W.core||'').trim()) x.push(`作者的点子：${W.core.trim()}`);
  if((W.title||'').trim()) x.push(`剧名：${W.title.trim()}`);
  return `你是短剧总编剧。依下面设定，规划一部 ${n} 集的竖屏短剧，每集约 ${wzMins(W)||1} 分钟。\n${x.join('\n')}\n\n${YQ_RULES}\n
只输出一个 JSON，不要任何说明：
{"title":"剧名（没给就自己取，8 字内）","logline":"一句话梗概","cast":[{"name":"人名（不要用设定里的形容词当名字）","role":"女主/男主/反派/配角","age":25,"bio":"一句话人设"}],"episodes":[{"title":"集名（6 字内）","event":"本集发生什么，两三句","hook":"集尾钩子，一句"}]}
cast 3 到 6 人；episodes 正好 ${n} 个，前后连贯，每集都有冲突与钩子，最后一集收尾。`;
}
function yqEpPrompt(d, W, i){
  const ep=d.outline[i], chars=Math.round((wzMins(W)||1)*400), prev=(d.eps[i-1]||'').slice(-600);
  return `你是短剧编剧。写《${d.title}》第 ${i+1} 集（共 ${d.outline.length} 集），约 ${chars} 字。
故事：${d.logline}
人物：${d.cast.map(c=>`${c.name}（${c.role}）${c.bio}`).join('；')}
各集大纲：
${d.outline.map((o,k)=>`第${k+1}集 ${o.title}：${o.event}`).join('\n')}
${prev?`上一集结尾：\n${prev}\n`:''}
本集要写：${ep.event}
集尾钩子：${ep.hook}

格式（只输出剧本，不要标题和说明）：
场1｜地点（内/外·日/夜）
[画面] 拍得出来的动作
人物名：「台词」

要求：开头 3 秒有钩子，场次 2 到 4 场，台词口语、短而有力，人名与设定一致，不写旁白说明，不用字幕交代剧情。
${YQ_RULES}`;
}
const parseJSON=t=>{ const a=t.indexOf('{'), b=t.lastIndexOf('}'); return JSON.parse(t.slice(a,b+1)); };
const yqRun={};
function yqRefresh(wid){
  const m=location.hash.match(/^#\/script\/v\/([^/]+)\/?(\w+)?/); if(!m||m[1]!==wid) return;
  const y=scrollY; viewVibeScript(wid, m[2]); scrollTo(0,y);
}
async function yqDrive(wid){
  if(yqRun[wid]) return; yqRun[wid]=1;
  const cur=()=>(store('works')||[]).find(x=>x.id===wid);
  try{
    let w=cur(); if(!w||!w.gen) return;
    if(!w.gen.data){
      const W=Object.assign({},WZ_DEF,w.W), n=Math.max(2,Math.min(80,+wzEps(W)||10));
      const pl=parseJSON(await yqChat(YQ_PLAN, yqPlanPrompt(W,n), 8000));
      const outline=(pl.episodes||[]).slice(0,n).map((e,i)=>({title:e.title||`第${i+1}集`, event:e.event||'', hook:e.hook||'', body:[e.event, e.hook?`钩子：${e.hook}`:''].filter(Boolean).join('\n\n')}));
      if(!outline.length) throw new Error('outline empty');
      const data={title:(pl.title||'').trim(), logline:pl.logline||'', outline, eps:[],
        cast:(pl.cast||[]).filter(c=>c&&c.name).map(c=>({name:String(c.name).trim(), role:String(c.role||'配角'), bio:`${c.age?c.age+' 岁，':''}${c.bio||''}`}))};
      updateGen(wid,{status:'writing', data}); yqRefresh(wid);
    }
    for(;;){
      w=cur(); if(!w||!w.gen||w.gen.status!=='writing'||!w.gen.data) break;
      const d=w.gen.data, i=d.outline.findIndex((_,k)=>!d.eps[k]);
      if(i<0){ updateGen(wid,{status:'done'}); yqRefresh(wid); break; }
      const txt=await yqChat(YQ_WRITE, yqEpPrompt(d, Object.assign({},WZ_DEF,w.W), i), 3000);
      if(!txt) throw new Error('empty episode');
      const w2=cur(); if(!w2||!w2.gen||!w2.gen.data) break;
      w2.gen.data.eps[i]=txt; updateGen(wid,{data:w2.gen.data}); yqRefresh(wid);
    }
  }catch(e){ updateGen(wid,{status:'error', err:String(e.message||e)}); yqRefresh(wid); }
  finally{ delete yqRun[wid]; }
}
function startYq(w){ updateGen(w.id,{engine:'yq', status:'outline', at:Date.now(), req:genReq(w.W), data:null, err:null}); }
/* 作品的剧本：有模型结果就用模型的，否则用模板草稿 */

  return {s, eps:sxScript(s)};
}

/* ---------- nav: 顶栏四大功能 + 各自的目录面板 ---------- */
const isPro = () => store('pro') !== false;
const chapterOf = folder => folder ? NAV.find(n => folder===n.key || folder.startsWith(n.key+'/')) : null;
const FUNCS = [
  {k:'script', icon:'script', label:'剧本', href:'#/script'},
  {k:'assets', icon:'assets', label:'资产库', href:'#/assets'},
  {k:'storyboard', icon:'play', label:'分镜', href:'#/storyboard'},
  {k:'prompts', icon:'grid', label:'提示词', href:'#/prompts'},
];
const funcOf = r => r.view==='tool' ? r.tool : (r.view==='start'||r.view==='partner') ? 'script' : r.view==='assembler' ? 'storyboard' : 'prompts';
function drawNav(route){
  const cur = route.folder || '';
  const ch = chapterOf(cur);
  const fn = funcOf(route);
  const hash = location.hash || '#/';

  document.getElementById('tbSeg').innerHTML = FUNCS.map(f =>
    `<a href="${f.href}" class="${fn===f.k&&route.view!=='start'&&route.view!=='partner'?'on':''}">${ico(f.icon)}${f.label}</a>`).join('');

  // 目录面板：四大功能各自一套
  const A = (href, label, o={}) => `<a class="${o.cls||''} ${o.on ?? hash===href ? 'on':''}" href="${href}">${o.icon?ico(o.icon):''}<span>${esc(label)}${o.d?`<span class="d">${esc(o.d)}</span>`:''}</span>${o.n!=null?`<span class="n">${o.n}</span>`:''}${o.pro?'<span class="ptag">PRO</span>':''}</a>`.replace('<a ', o.pro?'<a data-pro ':'<a ');
  const T = (t, icon) => `<div class="ps-title">${icon?ico(icon):''}${esc(t)}</div>`;
  const PICK = `<div class="ps-hr"></div>` + T('精选提示词','grid');
  const F = FUNCS.find(f=>f.k===fn);
  const title = fn==='prompts' ? (ch ? ch.label : '目录') : (route.view==='start'||route.view==='partner') ? '目录' : F.label+'目录';
  const pill = `${esc(title)} ${ico('panel')}`;
  let h = `<div class="ps-row"><button class="pill" id="psClose" title="收起">${pill}</button></div>`;
  if(route.vibe){ const V=route.vibe;
    h += T('当前作品') + A('#/script/v/'+V.id+'/outline','《'+V.title+'》',{cls:'head fn',icon:'script',on:false})
      + [['outline','各集大纲','text'],['script','剧情对话','pen'],['assets','角色资产库','user'],['board','分镜图','play']]
        .map(([k,l,ic])=>A('#/script/v/'+V.id+'/'+k,l,{cls:'fn sub',icon:ic,on:V.tab===k})).join('') + `<div class="ps-hr"></div>`;
  }

  if(fn==='script'){
    const works = store('works')||[];
    if(isPro() && route.view!=='start' && route.view!=='partner'){
      h += T('PRO 专业版') + A('#/script','我的作品',{cls:'head fn',icon:'script',n:works.length}) + A('#/script/new','新增作品',{cls:'head fn',icon:'plus',on:route.sub==='new'&&!route.wid});
      if(works.length) h += T('作品') + works.map(w=>A(w.kind==='simple'?'#/script/s/'+w.id:w.kind==='vibe'?'#/script/v/'+w.id:'#/script/w/'+w.id, '《'+(w.title||'未命名')+'》',{on:!route.vibe&&(route.wid===w.id||route.sid===w.id)})).join('');
    } else {
      const mine = works.filter(w=>w.kind==='simple');
      h += T('标准版') + A(route.view==='start'?'#/':'#/script','人物即剧本',{cls:'head fn',icon:'sparkle',on:!route.sub,d:'选主角，一键产出 10 集'});
      if(mine.length) h += T('我的剧本') + mine.map(w=>A('#/script/s/'+w.id,'《'+w.title+'》',{on:route.sid===w.id,d:w.sx.name+' · '+w.sx.role.type})).join('');
      // 标准版也能直接进 PRO：新增作品与 PRO 作品，点了自动切到 PRO
      const proW = works.filter(w=>w.kind!=='simple');
      h += T('作品') + A('#/script/new','新增作品',{cls:'head fn',icon:'plus',pro:1,on:false});
      h += proW.map(w=>A('#/script/w/'+w.id,'《'+(w.title||'未命名')+'》',{pro:1,on:false})).join('');
    }
    h += PICK + NAV.slice(0,3).map(n=>A('#/f/'+n.key,n.label,{cls:'fn',icon:n.icon,n:inFolder(n.key).length})).join('');
  } else if(fn==='assets'){
    const mine = store('assets')||[];
    h += A('#/assets','资产首页',{cls:'head fn',icon:'assets',on:!route.fn&&!route.vibe});
    for(const m of ASSET_MENUS) h += T(m.title) + m.items.map(i=>A('#/assets/'+i.id,i.label,{cls:'fn',icon:i.icon,on:route.fn===i.id&&route.idx==null})).join('');
    if(mine.length) h += T('我的资产') + mine.map((x,k)=>A(`#/assets/${x.fn}?i=${k}`,x.name||'未命名',{cls:'fn',icon:FN[x.fn]?.menu.key==='scene'?'mount':'user',on:route.fn===x.fn&&route.idx===k,d:FN[x.fn]?.label||''})).join('');
    h += PICK + A('#/f/06-video/styles','画风块',{cls:'fn',icon:'film'}) + A('#/f/archive/05-design','角色与场景设定（归档）',{cls:'fn',icon:'box'});
  } else if(fn==='storyboard'){
    h += A('#/storyboard','分镜首页',{cls:'head fn',icon:'play',on:route.vibe?false:undefined}) + A('#/assembler','6.0 组装器',{cls:'head fn',icon:'wand',d:'把剧本组装成视频提示词'});
    const v = NAV.find(n=>n.key==='06-video');

    h += T('按流程');
    for(const n of NAV){
      h += A('#/f/'+n.key, n.label, {cls:'head fn', icon:n.icon, on:cur===n.key&&route.view==='list', n:inFolder(n.key).length});

      for(const [k,l] of (n.subs || [[n.key,'']])){
        const list = inFolder(k); if(!list.length) continue;
        if(l) h += A('#/f/'+k, l, {cls:'head sub', on:cur===k&&route.view==='list', n:list.length});
        h += list.map(e=>`<a class="sub ${route.id===e.id?'on':''}" href="#/e/${e.id}"><span class="i">${e.id}</span><span>${esc(e.title)}</span></a>`).join('');
      }
    }
    h += `<div class="ps-hr"></div>` + T('工具与资料') + A('#/assembler','6.0 组装器',{cls:'fn',icon:'wand'}) + A('#/changelog','更新记录',{cls:'fn',icon:'clock'});
  }
  const ps = document.getElementById('pside'); ps.innerHTML = h;
  ps.querySelectorAll('[data-pro]').forEach(a=>a.onclick=()=>store('pro',true));
  document.getElementById('psOpen').innerHTML = pill;
  document.getElementById('psClose').onclick = () => setPanel(false);
  // PRO 开关：开 = 专业版（现有完整流程），关 = 标准版（简化流程）
  document.querySelectorAll('.pro-slot').forEach(s => {
    s.innerHTML = `<button class="pro ${isPro()?'on':''}" title="${isPro()?'专业版：完整流程':'标准版：简单几步出剧本'}"><b>PRO</b><span class="sw ${isPro()?'on':''}"></span>${isPro()?'':'<em>标准版</em>'}</button>`;
    s.firstChild.onclick = () => { store('pro', !isPro()); toast(isPro()?'已切换到 PRO 专业版':'已切换到标准版'); dispatchEvent(new HashChangeEvent('hashchange')); };
  });
  const on = ps.querySelector('a.on'); if(on) on.scrollIntoView({block:'nearest'});
}

/* ---------- views ---------- */
const state = {q:'', lic:'all', prod:false};
function filtered(list){
  const q=state.q.trim().toLowerCase();
  return list.filter(e=>{
    if(state.lic==='direct' && !e.license.includes('可直接用')) return false;
    if(state.lic==='ref' && !e.license.includes('仅参考')) return false;
    if(state.lic==='int' && !e.license.startsWith('内部')) return false;
    if(state.prod && !(e.status||'').includes('已用于生产')) return false;
    if(q && !(e.id+' '+e.title+' '+e.body).toLowerCase().includes(q)) return false;
    return true;
  });
}
function cardsHtml(list){
  if(!list.length) return '<div class="empty">没有符合条件的提示词</div>';
  return '<div class="grid">'+list.map(e=>`<a class="card" href="#/e/${e.id}" style="text-decoration:none">
    <span class="id">${e.id}</span>
    <h3>${esc(e.title)}</h3>
    <div class="desc">${esc(usage(e.body))}</div>
    <div class="tags">${tagsHtml(e)}</div></a>`).join('')+'</div>';
}

function funcIndex(){

  add('script','人物即剧本','标准版：选主角，一键产出 10 集剧本','#/script','剧本 编剧 人物 角色 主角 男主 女主 男频 女频 一键 10集',{pro:false});

  for(const g of ['male','female']) DATA.roles[g].forEach((t,i)=>add('script',t.type,`${g==='male'?'男频':'女频'} · ${t.gold}`,'#/script',
    `剧本 人物 角色 主角 ${g==='male'?'男频 男主':'女频 女主'} ${Object.values(t).join(' ')}`,{pro:false,g,idx:i}));
  for(const m of ASSET_MENUS) for(const i of m.items) add('assets',i.label,i.desc,'#/assets/'+i.id,
    `资产 ${m.title} ${m.key==='role'?'角色 人物 主角 男主 女主 对手 设定 三视图 特写':'场景 空镜 设定 天气 昼夜'}`);
  add('storyboard','分镜','把剧本拆成分镜表，再组装成视频提示词','#/storyboard','分镜 镜头 视频 分镜表 成片');
  add('storyboard','6.0 组装器','组装每集 4～6 段视频提示词，可换画风','#/assembler','分镜 视频 组装 6.0 画风 镜头');
  return L;
}
function drawFuncHits(on){
  const box=document.getElementById('fhits'); if(!box) return;
  const toks=state.q.trim().toLowerCase().split(/[\s,，、]+/).filter(Boolean);
  if(!on || !toks.length){ box.innerHTML=''; return; }
  const hits=funcIndex().filter(x=>toks.every(t=>x.kw.includes(t))).sort((a,b)=>!!(a.pick&&a.pick.g)-!!(b.pick&&b.pick.g));
  if(!hits.length){ box.innerHTML=''; return; }
  const F=Object.fromEntries(FUNCS.map(f=>[f.k,f]));
  const show=hits.slice(0,9);
  box.innerHTML=`<div class="sec-head" style="margin:30px 0 12px"><h2 style="font-size:18px">相关功能</h2><span class="meta">${hits.length} 项${hits.length>show.length?' · 显示前 '+show.length+' 项':''}</span></div>
    <div class="fhits">${show.map((x,k)=>`<a class="fhit" href="${x.href}" data-k="${k}"><span class="ft">${ico(F[x.fn].icon)}${F[x.fn].label}</span><b>${esc(x.title)}</b><span class="fd">${esc(x.desc)}</span></a>`).join('')}</div>
    <div class="sec-head" style="margin:30px 0 0"><h2 style="font-size:18px">提示词</h2></div>`;
  box.querySelectorAll('.fhit').forEach(a=>a.onclick=()=>{
    const p=show[+a.dataset.k].pick; if(!p) return;
    store('pro',p.pro);
    if(p.g) store('sxPick',{g:p.g,idx:p.idx,name:'',title:'',q:''});
  });
}
function grouped(list){
  return DATA.groups.map(g=>{

    return `<div class="sec-head" style="margin:30px 0 12px"><h2 style="font-size:18px">${esc(g.label)}</h2><span class="meta">${l.length} 条</span></div>${cardsHtml(l)}`;
  }).join('');
}

}
function bindComposer(update){

  document.querySelectorAll('#lic button').forEach(b=>{
    b.classList.toggle('on',b.dataset.v===state.lic);
    b.onclick=()=>{state.lic=b.dataset.v;document.querySelectorAll('#lic button').forEach(x=>x.classList.toggle('on',x===b));update()};
  });
  const p=document.getElementById('prod');
  p.onclick=()=>{state.prod=!state.prod;p.classList.toggle('on',state.prod);update()};
  update();
}
function versionLine(){const m=DATA.changelog.match(/版本：([^｜\n]+)/);return m?m[1].trim():''}

function viewEntry(id){
  const e=byId[id]; const v=document.getElementById('view');
  if(!e){v.innerHTML='<div class="empty">找不到这条提示词</div>';return}
  const sib=inFolder(e.folder); const i=sib.indexOf(e);
  const prev=sib[i-1], next=sib[i+1];
  const prompt=firstCode(e.body);
  v.innerHTML=`<article class="detail">
    <div class="crumb"><a href="#/prompts">全部</a>›<a href="#/f/${e.folder}">${esc(GROUP_LABEL[e.folder]||e.folder)}</a>›<span>${e.id}</span></div>
    <h1>${e.id}　${esc(e.title)}</h1>
    <div class="tags">${tagsHtml(e,true)}</div>
    <div class="row" style="margin-bottom:20px">
      ${prompt?`<button class="btn-white" id="cp">${ico('copy')}复制提示词正文</button>`:''}
      ${e.id==='6.0'?`<a class="btn-dark" href="#/assembler">${ico('wand')}在组装器里调整</a>`:''}
      <span class="tag tool" style="align-self:center">${esc(e.path)}</span>
    </div>
    <div class="md" id="md"></div>
    <div class="pager">${prev?`<a href="#/e/${prev.id}"><small>上一条</small>${prev.id} ${esc(prev.title)}</a>`:'<span style="flex:1"></span>'}
      ${next?`<a class="r" href="#/e/${next.id}"><small>下一条</small>${next.id} ${esc(next.title)}</a>`:'<span style="flex:1"></span>'}</div>
  </article>`;
  document.getElementById('md').appendChild(renderMd(e.body));
  if(prompt) document.getElementById('cp').onclick=ev=>copyText(prompt,ev.currentTarget);
}

function viewDoc(title, md){
  const v=document.getElementById('view');
  v.innerHTML=`<article class="detail"><div class="crumb"><a href="#/prompts">全部</a>›<span>${title}</span></div><h1>${title}</h1><div class="md" id="md"></div></article>`;
  document.getElementById('md').appendChild(renderMd(md.replace(/^# .*\n/,'')));
}

/* ---------- 6.0 assembler ---------- */
const OPT_INFO = {'成人内容':'6.0【一】第 7 条：成人镜头的详细描写要求。只用于成人线项目，全年龄线不要打开（和第七章合规红线冲突）。'};
function viewAssembler(ep){
  const styles=Object.keys(DATA.core.styles);
  const saved=store('asm')||{};
  const st={style:saved.style&&(saved.style==='__custom'||styles.includes(saved.style))?saved.style:styles[0],
            custom:saved.custom||'', opts:{}};
  const SEC='一二三四五六七';
  const patches={}; ENTRIES.forEach(e=>(e.patches||[]).forEach(s=>(patches[s]=patches[s]||[]).push(e)));
  const v=document.getElementById('view');
  let epTxt='', head=`<h2>6.0 视频专用提示词 · 组装器</h2><span class="meta">分镜表 → 每集 4~6 段长视频提示词（生产在用）</span>`;
  const ew = ep && (store('works')||[]).find(x=>x.id===ep.wid);
  if(ew){ const {s:sx, eps}=vibeData(ew), i=Math.min(ep.i, eps.length-1);
    epTxt=eps[i]; head=`<h2>第 ${i+1} 集：${esc(sx.outline[i][0])}</h2><span class="meta">《${esc(ew.title)}》· 分镜图编辑</span>`; }
  v.innerHTML=`${backBar(ew?`#/script/v/${ew.id}/board`:null)}<div class="sec-head" style="margin-top:56px">${head}</div>
  <div class="asm">
    <div>
      <div class="panel"><h4>统一视觉风格（第三部分）</h4>
        <span class="seg" id="sty">${styles.map(s=>`<button data-v="${esc(s)}">${esc(s)}</button>`).join('')}<button data-v="__custom">自定义</button></span>
        <textarea class="style" id="customStyle" placeholder="粘贴这个项目的画风描述，会替换【三、统一视觉风格】的正文" style="display:none">${esc(st.custom)}</textarea>
      </div>
      <div class="panel"><h4>可选条款</h4>
        ${Object.keys(DATA.core.options).map(o=>`<div class="toggle"><div class="t"><b>${esc(o)}</b><span>${esc(OPT_INFO[o]||'')}</span></div><button class="sw" data-o="${esc(o)}" aria-label="${esc(o)}"></button></div>`).join('')}
        <div class="warn" id="optWarn" style="display:none">已打开成人内容条款，请确认这是成人线项目。</div>
      </div>
      <div class="panel"><h4>可补进各部分的条目</h4><div class="plist">
        ${[...SEC].filter(s=>patches[s]).map(s=>patches[s].sort((a,b)=>cmpId(a.id,b.id)).map(e=>`<a href="#/e/${e.id}"><span class="s">【${s}】</span><span>${e.id} ${esc(e.title)}</span></a>`).join('')).join('')}
      </div></div>
    </div>
    <div>
      <div class="code" style="margin:0">
        <div class="bar"><span id="stat"></span><span class="sp"></span>
          <button class="btn-dark" id="dl" style="height:30px">${ico('dl')}下载 .txt</button>
          <button class="copy" id="cpAll">${ico('copy')}复制全部</button></div>
        <pre id="out" style="max-height:calc(100vh - 220px)"></pre>
      </div>
    </div>
  </div>`;
  const out=document.getElementById('out'), ta=document.getElementById('customStyle');
  function assemble(){
    const style = st.style==='__custom' ? st.custom : DATA.core.styles[st.style];
    let text = DATA.core.parts.join('\n');
    text = text.replace(/^\{\{OPT:([^}]+)\}\}\n?/gm,(m,n)=> st.opts[n] ? DATA.core.options[n]+(m.endsWith('\n')?'\n':'') : '');
    return text.replace('{{STYLE}}', style) + (epTxt ? '\n\n' + epTxt : '');
  }
  let ready=false;
  function update(){
    document.querySelectorAll('#sty button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.style));
    ta.style.display = st.style==='__custom'?'block':'none';
    document.querySelectorAll('.sw[data-o]').forEach(b=>b.classList.toggle('on',!!st.opts[b.dataset.o]));
    document.getElementById('optWarn').style.display = st.opts['成人内容']?'block':'none';
    const t=assemble(); out.textContent=t;
    document.getElementById('stat').textContent=`${t.length} 字 · 风格：${st.style==='__custom'?'自定义':st.style} · 可选条款：${Object.keys(st.opts).filter(k=>st.opts[k]).join('、')||'无'}`;
    store('asm',{style:st.style,custom:st.custom});
    if(ready) backDirty(()=>{ store('asm',{style:st.style,custom:st.custom}); toast('已储存'); });
  }
  document.querySelectorAll('#sty button').forEach(b=>b.onclick=()=>{st.style=b.dataset.v;update()});
  ta.oninput=()=>{st.custom=ta.value;update()};
  document.querySelectorAll('.sw[data-o]').forEach(b=>b.onclick=()=>{st.opts[b.dataset.o]=!st.opts[b.dataset.o];update()});
  document.getElementById('cpAll').onclick=e=>copyText(assemble(),e.currentTarget);
  document.getElementById('dl').onclick=()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([assemble()],{type:'text/plain;charset=utf-8'}));
    a.download='6.0视频专用提示词.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  update(); ready=true;
}

/* ---------- router ---------- */
function parse(){
  const h=location.hash.replace(/^#\/?/,'');
  if(h==='membership') return {view:'membership'};
  if(h.startsWith('e/')) {const e=byId[h.slice(2)];return {view:'entry',id:h.slice(2),folder:e&&e.folder}}
  if(h.startsWith('f/')) return {view:'list',folder:h.slice(2)};
  if(h==='assembler'||h==='changelog') return {view:h};
  if(h.startsWith('assembler?ep=')){ const [wid,i]=h.slice(13).split('.'), w=(store('works')||[]).find(x=>x.id===wid);
    return w ? {view:'assembler', ep:{wid, i:+i}, vibe:{id:wid, title:w.title, tab:'board'}} : {view:'assembler'}; }
  if(h.startsWith('script/s/')) {const [id,q]=h.slice(9).split('?');return {view:'tool',tool:'script',sub:'result',sid:id,fresh:q==='new=1'}}
  if(h==='script/new') return {view:'tool',tool:'script',sub:'new'};
  if(h.startsWith('script/v/')){ const [wid,vtab]=h.slice(9).split('/'); return {view:'tool',tool:'script',sub:'vibe',wid,vtab}; }
  if(h.startsWith('script/w/')) return {view:'tool',tool:'script',sub:'new',wid:h.slice(9)};
  if(h.startsWith('assets/')) {const [fn,q]=h.slice(7).split('?i=');return {view:'tool',tool:'assets',fn,idx:q==null?null:+q}}
  if(h==='partner') return {view:'partner'};
  if(TOOLS[h]) return {view:'tool',tool:h};
  if(h==='prompts') return {view:'home'};
  return {view:'start'};
}
function route(){
  const r=parse(); drawNav(r);
  // 手机上每次换页都收起面板；电脑上沿用上次的展开/收起状态
  document.body.classList.toggle('ps-off', matchMedia('(max-width:760px)').matches || store('panel')===false);
  document.querySelector('.tb-logo').classList.toggle('on', r.view==='start');
  if(r.view==='start') viewScriptSimple();
  else if(r.view==='membership') viewMembership();
  else if(r.view==='entry') viewEntry(r.id);
  else if(r.view==='assembler') viewAssembler(r.ep);
  else if(r.view==='tool' && r.tool==='assets') r.fn ? viewAssetEditor(r.fn, r.idx) : viewAssets();
  else if(r.view==='tool' && r.tool==='script'){
    if(r.sub==='result') viewScriptResult(r.sid, r.fresh);
    else if(r.sub==='vibe') viewVibeScript(r.wid, r.vtab);
    else if(!isPro()) viewScriptSimple();
    else r.sub ? viewScriptNew(r.wid) : viewScriptHome();
  }
  else if(r.view==='tool') viewTool(r.tool);
  else if(r.view==='partner') viewPartner();
  else if(r.view==='changelog') viewDoc('更新记录', DATA.changelog);
  else viewList(r);
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
route();
</script>
