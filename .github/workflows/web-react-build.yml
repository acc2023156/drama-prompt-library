name: React 前端构建校验

# 只构建与测试 packages/web-react，不发布任何东西，不用任何密钥。
# 与 pages.yml、publish-site.yml 不同，这里不限定仓库：校验在任何启用了 Actions 的副本上都应运行。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-react-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: 安装依赖（只装 web-react）
        run: npm ci --workspace @tianji/web-react --no-audit --no-fund
      - name: 类型检查
        run: npm run typecheck -w @tianji/web-react
      - name: 测试（含旧页面对照）
        run: npm run test -w @tianji/web-react
      - name: 构建
        run: npm run build -w @tianji/web-react
        env:
          TIANJI_API_BASE: https://api.example.test/
      - name: 校验产物（单文件、数据相等、后端地址）
        run: npm run check:dist -w @tianji/web-react
        env:
          TIANJI_API_BASE: https://api.example.test/
      - name: 记录产物体积
        run: |
          size=$(wc -c < packages/web-react/dist/index.html)
          echo "web-react dist/index.html: ${size} bytes" | tee -a "$GITHUB_STEP_SUMMARY"
