name: 热点同步

on:
  schedule:
    - cron: '0 23,11 * * *'   # 北京时间早 7 点、晚 7 点
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: github.repository == 'acc2023156/drama-prompt-library'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sync
        env:
          HOT_SRC: ${{ secrets.HOT_SRC }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          set -u
          # 来源偶尔连不上：重试几次；还是不行就跳过这一轮（网站继续用上一批资料），不当成失败
          ok=0
          for i in 1 2 3 4; do
            code=$(curl -s --max-time 60 -o hot.json -w '%{http_code}' "$HOT_SRC?t=$(date +%s)") || code=000
            echo "source try $i: http $code"
            if [ "$code" = "200" ] && [ -s hot.json ]; then ok=1; break; fi
            sleep $((i * 15))
          done
          if [ "$ok" != "1" ]; then echo "::warning::source unreachable, keep last batch"; exit 0; fi
          for i in 1 2 3; do
            code=$(curl -s -o push.out -w '%{http_code}' -X POST -H "X-Job-Secret: $JOB_SECRET" -H 'Content-Type: application/json' \
              --data-binary @hot.json "$WORKER_URL/hot/push") || code=000
            echo "push try $i: http $code"
            [ "$code" = "200" ] && { echo synced; exit 0; }
            sleep 10
          done
          echo "::warning::push failed, keep last batch"
