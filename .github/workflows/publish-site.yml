name: 同步发布站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'acc2023156/drama-prompt-library'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成网页
        run: python tools/build.py site
        env:
          PYTHONUTF8: "1"
      - name: 推到发布站
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          if [ -z "$SITE_TOKEN" ]; then echo "SITE_TOKEN not set, skip"; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/acc2023156/drama-prompt-library-site.git" pub
          cp site/index.html pub/index.html
          cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Publish: $(printf '%s' "${MSG:-update}" | head -n1)"
          git push -q origin main
          echo published
